{{- if .Values.kafka.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-creator
  namespace: {{ .Values.global.namespace | default "platform" }}
  labels:
    app: kafka-topic-creator
    {{- include "s4-stream.labels" . | nindent 4 }}
  annotations:
    # Run as a hook so `helm upgrade` replaces the Job instead of patching it:
    # Job spec.template is immutable and a server-side apply of a changed
    # template fails (see s4 upgrade failure). before-hook-creation deletes
    # the previous hook Job before the new one is created.
    #
    # post-install AND post-upgrade, never pre-install and never pre-upgrade:
    # the initContainer waits for kafka.platform.svc.cluster.local:9092, which
    # is created by kafka.yaml in this same release as an ordinary
    # (non-hook) resource. A pre-install hook runs before Helm has created
    # anything, so the loop below burned its 300 s and the whole
    # `helm install s4-stream` failed - taking Kafka, the Flink operator and
    # both FlinkDeployments down with it.
    #
    # pre-upgrade has the SAME problem from the other side: the broker is an
    # ordinary resource of this release, so a pre-upgrade hook runs before
    # Helm has reconciled it, and when the previous phase had scaled Kafka
    # down (which the ramp increments do, to fit in the RAM) there is no
    # broker to talk to at all:
    #   pre-upgrade hooks failed: resource Job/platform/kafka-topic-creator
    #   not ready. status: Failed, message: Job Failed. failed: 1/1
    # The price of running afterwards is that the Flink job may be applied
    # before its topic exists; the KafkaSource retries until it does.
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    # The default hook timeout is 5 minutes, and on a 6 GiB box the broker
    # needs longer to accept the topic requests while the cluster is swapping.
    helm.sh/hook-timeout: 20m

spec:
  backoffLimit: 10
  # The initContainer already gives up after 300s, so the Job fails rather than
  # hangs; this bounds the retries too (backoffLimit x 300s is otherwise ~50
  # min of a Helm install that looks stuck).
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: kafka-topic-creator
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Kafka broker on port 9092 (timeout 300s)..."
              DEADLINE=$(($(date +%s) + 300))
              until nc -z -w 2 kafka.{{ .Values.global.namespace | default "platform" }}.svc.cluster.local 9092; do
                if [ "$(date +%s)" -ge "${DEADLINE}" ]; then
                  echo "ERROR: Kafka did not become reachable within 300 seconds."
                  exit 1
                fi
                sleep 2
              done
              echo "Kafka is reachable."
      containers:
        - name: topic-init
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          imagePullPolicy: {{ .Values.kafka.image.pullPolicy }}
          command:
            - /bin/sh
            - -ce
            - |
              echo "Initializing Kafka Topics..."
              {{- range .Values.topics }}
              /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server kafka.{{ $.Values.global.namespace | default "platform" }}.svc.cluster.local:9092 \
                --create --if-not-exists \
                --topic {{ .name }} \
                --partitions {{ .partitions }} \
                --replication-factor {{ .replicationFactor }}
              {{- end }}
              echo "Listing created topics:"
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka.{{ .Values.global.namespace | default "platform" }}.svc.cluster.local:9092 --list
              echo "Topics successfully provisioned."
{{- end }}
