# Modern Data Architecture POC — project metadata and tooling configuration.
#
# NOTE on packaging: the codebase uses the "repo-root on sys.path" layout
# (`from src.x import y`, see pytest `pythonpath`), so this file is
# CONFIG-ONLY: no [build-system] and no declared packages. `pip install`
# is not required to run the POC — install only the runtime deps below.

[project]
name = "poc-data-engineering"
version = "0.1.0"
description = "Modern Data Architecture POC: Data Mesh, Data Fabric, Medallion Lakehouse, Lambda/Kappa, Serving Layer (100% open source, local-first)"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
# Governance JSON-schema validation (used opportunistically; structural checks run without it)
contracts = ["jsonschema>=4.0"]
# Infrastructure-backed adapters (PostgreSQL source, Trino serving, Kafka broker)
integrations = ["psycopg2-binary>=2.9", "trino>=0.330", "confluent-kafka>=2.3"]
# Orchestration assets
orchestration = ["dagster>=1.6"]
# Dev toolchain: tests + lint + types
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501 is covered by line-length; per-file ignores only where justified below.
ignore = []

[tool.ruff.format]
# Formatter enabled with ruff's documented defaults (deliberately no overrides):
# quote-style = "double", indent-style = "space", line-ending = "lf",
# skip-magic-trailing-comma = false. Guarded in CI by `ruff format --check`
# (see .github/workflows/ci.yml) and locally by `rake format:check`;
# `rake format` rewrites in place over the same directories as `rake lint`.


[tool.mypy]
python_version = "3.11"
files = ["src", "pipelines", "governance", "quality"]
explicit_package_bases = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_return_any = true
strict_equality = true
exclude = "__pycache__"

# Scoped `ignore_missing_imports`: the repo-root layout means a typo'd INTERNAL
# import (e.g. `src.use_casesx`) must fail loudly, so the flag is never global.
# Only third-party modules that mypy cannot type-check are listed below
# (verified by running mypy with no global flag: exactly these 8 errors).
# NOT listed because they ship types and pass as-is: requests, click, rich,
# dagster. NOT listed because they are outside `files`: faker (data-generator).
[[tool.mypy.overrides]]
# Integrations extra — not installed in the dev environment (no stubs).
module = ["trino", "confluent_kafka", "psycopg2", "psycopg2.extras"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Installed but untyped (upstream ships no py.typed; stubs would come from
# types-PyYAML / types-jsonschema, not added as deps).
module = ["yaml", "jsonschema"]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Warnings are errors: resource leaks (unclosed SQLite handles) and
# deprecations fail the suite instead of rotting silently.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# Ratcheted 70 -> 85 (W8): measured 91.24% at ratchet time, so regressions of
# >6 points fail CI instead of silently eroding the gate.
fail_under = 85
show_missing = true
