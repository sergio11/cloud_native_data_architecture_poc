# Batch profile. Each `subsystems.<chart>` is a verbatim Helm values fragment
# for infra/helm/<chart>. Bronze is written by the s1 CronJob, silver and gold
# by the Spark Operator, so the Spark bronze job stays disabled.

profile:
  name: "batch"
  description: "Medallion batch ETL on the Spark Operator (bronze via the ingestion CronJob)"
  targetRamMb: 3968
  targetCpuCores: 4.0

subsystems:
  s1-ingestion:
    postgresql:
      enabled: true
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "384Mi"
    ingestionRunner:
      enabled: true
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "300m"
          memory: "256Mi"

  s2-lakehouse:
    minio:
      enabled: true
      resources:
        requests:
          cpu: "150m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "384Mi"
    polaris:
      enabled: true
      resources:
        requests:
          cpu: "150m"
          memory: "384Mi"
        limits:
          cpu: "600m"
          # Below ~1Gi the JVM spends its time in GC and never becomes ready.
          memory: "1024Mi"

  s3-batch:
    sparkOperator:
      enabled: true
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "400m"
          memory: "384Mi"
    sparkDefaults:
      driver:
        cores: 1
        coreLimit: "1000m"
        # memory is the JVM heap; the container limit is memory + overhead.
        memory: "512m"
        memoryOverhead: "384m"
      executor:
        cores: 1
        coreLimit: "1000m"
        instances: 1
        memory: "512m"
        memoryOverhead: "384m"
