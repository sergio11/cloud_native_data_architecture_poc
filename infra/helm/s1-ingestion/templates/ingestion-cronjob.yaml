{{- if .Values.ingestionRunner.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: medallion-bronze-ingestion-cron
  namespace: {{ .Values.global.namespace | default "platform" }}
  labels:
    app: bronze-ingestion-cron
    {{- include "s1-ingestion.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.ingestionRunner.schedule | quote }}
  successfulJobsHistoryLimit: {{ .Values.ingestionRunner.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.ingestionRunner.failedJobsHistoryLimit }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: bronze-ingestion-cron
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ingestion-runner
              image: "{{ .Values.ingestionRunner.image.repository }}:{{ .Values.ingestionRunner.image.tag }}"
              imagePullPolicy: {{ .Values.ingestionRunner.image.pullPolicy }}
              # Real pipeline: image poc/ingest bakes the repo at /app (see
              # infra/docker/ingest.Dockerfile), so the repo-relative entrypoint resolves.
              command:
                - python
                - pipelines/medallion/bronze_ingestion.py
                - --entity
                - all
              workingDir: /app
              env:
                {{- range $key, $val := .Values.ingestionRunner.env }}
                - name: {{ $key }}
                  value: {{ $val | quote }}
                {{- end }}
              resources:
                {{- toYaml .Values.ingestionRunner.resources | nindent 16 }}
{{- end }}
