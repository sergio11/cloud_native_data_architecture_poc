# ==============================================================================
# Subsystem S8: Operations & Observability - Values Configuration
# File: infra/helm/s8-ops/values.yaml
# Scope (K-B): this chart is SELF-CONTAINED (no external subchart dependencies;
# the environment is offline so nothing can be fetched). Only the components
# below with templates/ are rendered: prometheus + grafana.
# ==============================================================================

global:
  namespace: platform

grafana:
  enabled: true
  replicaCount: 1
  image:
    repository: grafana/grafana
    tag: 10.2.0
    pullPolicy: IfNotPresent
  admin:
    user: admin
    # POC default only; override with --set grafana.admin.password=... .
    password: prom-operator
  service:
    type: NodePort
    port: 3000
    nodePort: 30000
  resources:
    limits:
      cpu: "300m"
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "128Mi"

prometheus:
  enabled: true
  replicaCount: 1
  image:
    repository: prom/prometheus
    tag: v2.48.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9090
  scrapeInterval: 15s
  retention: 15d
  resources:
    limits:
      cpu: "300m"
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "128Mi"

# NOT RENDERED (K-B decision): no template in templates/ consumes this block and
# there is no upstream subchart declared (offline env: dependencies cannot be
# fetched). Kept as COMMENT (not promised) so a future agent can wire it
# without re-discovering the intended shape.
