# Stream processing subsystem: Kafka, Flink operator and the Flink jobs.

global:
  namespace: platform
  computeNamespace: sales
  storageClass: "standard"

kafka:
  enabled: true
  replicaCount: 1
  image:
    repository: apache/kafka
    tag: "3.7.0"
    pullPolicy: IfNotPresent

  # In-cluster address; outside the cluster this name does not resolve.
  bootstrapServers: "kafka.platform.svc.cluster.local:9092"

  # Broker RSS is heap plus direct buffers; keep heapOpts within limits.memory.
  heapOpts: "-Xms384m -Xmx512m -XX:MaxDirectMemorySize=128m"

  service:
    type: ClusterIP
    port: 9092

  persistence:
    enabled: true
    storageClass: "standard"
    size: 5Gi

  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: 800m
      memory: 768Mi

  # Empty schedules anywhere (multi-node: node-role.kubernetes.io/storage).
  nodeSelector: {}

kafkaUi:
  # Off by default: it is a UI, not part of the data path.
  enabled: false
  replicaCount: 1
  image:
    repository: provectuslabs/kafka-ui
    tag: "v0.7.2"
    pullPolicy: IfNotPresent

  service:
    type: NodePort
    port: 8090
    # Must match the 8090 port kind forwards to the host.
    nodePort: 8090

  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 192Mi

topics:
  - name: "sales.orders.events"
    partitions: 3
    replicationFactor: 1
  - name: "marketing.clickstream.raw"
    partitions: 3
    replicationFactor: 1

# Flink logging rendered into spec.logConfiguration: the operator's ConfigMap
# shadows the image log4j config, so without this the JVMs only emit errors.
flinkLogConfiguration:
  log4j-console.properties: |
    rootLogger.level = INFO
    rootLogger.appenderRef.console.ref = ConsoleAppender

    appender.console.name = ConsoleAppender
    appender.console.type = CONSOLE
    appender.console.target = SYSTEM_OUT
    appender.console.layout.type = PatternLayout
    # %c is truncated: the Iceberg/Hadoop class names are long.
    appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c - %m%n

    # Flink lifecycle: REST binding, slot registration, checkpoint and sink failures.
    logger.flink.name = org.apache.flink
    logger.flink.level = INFO

    # Iceberg and Polaris log outside org.apache.flink.
    logger.iceberg.name = org.apache.iceberg
    logger.iceberg.level = INFO
    logger.icebergRest.name = org.apache.iceberg.rest
    logger.icebergRest.level = INFO

    # Kafka source: group assignment and offset commits.
    logger.kafka.name = org.apache.kafka
    logger.kafka.level = INFO

    # S3A logs its effective configuration and credential resolution at INFO.
    logger.hadoop.name = org.apache.hadoop
    logger.hadoop.level = INFO
    logger.hdfs.name = org.apache.hadoop.hdfs
    logger.hdfs.level = WARN

    # Noise.
    logger.zookeeper.name = org.apache.zookeeper
    logger.zookeeper.level = WARN
    logger.netty.name = org.apache.flink.shaded.netty.akka.org.jboss.netty
    logger.netty.level = ERROR
    logger.nettytp.name = org.apache.flink.shaded.netty4.netty
    logger.nettytp.level = ERROR

flinkOperator:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/apache/flink-kubernetes-operator
    tag: "1.8.0"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      # Below 400m CPU the operator misses its own health endpoint.
      cpu: 800m
      memory: 512Mi

  # Empty schedules anywhere (multi-node: node-role.kubernetes.io/compute).
  nodeSelector: {}

# warehouse must match polaris.config.warehouseLocation in s2-lakehouse, or
# Flink and Polaris disagree about where the table files live.
icebergCatalog:
  name: "polaris"
  uri: "http://polaris.platform.svc.cluster.local:8181/api/catalog"
  warehouse: "s3://warehouse/"
  s3Endpoint: "http://minio.platform.svc.cluster.local:9000"
  s3AccessKey: "minioadmin"
  s3SecretKey: "minioadmin"
  # client_id:client_secret; must match polaris.clientId/clientSecret in s2-lakehouse.
  oauth2Credential: "poc-admin:poc-admin-secret"

flinkJobs:
  ordersStream:
    enabled: true
    # Per job: global.computeNamespace cannot express two domains.
    namespace: "sales"
    # Built from the repo root with infra/docker/flink.Dockerfile.
    image: poc/flink-stream:0.1.0
    # Empty schedules anywhere; pinning avoids loading the image on every node.
    nodeSelector: {}
    # Process memory must exceed heap + metaspace + overhead; the operator rejects less than 768m.
    jobManager:
      memory: "768m"
      cpu: 0.3
    taskManager:
      memory: "1024m"
      cpu: 0.4
      # Must stay under taskManager: a job-level value renders empty.
      replicas: 1
    topic: "sales.orders.events"
    kafkaGroupId: "flink-orders-speed-group"
    # 'earliest' only replays from offset 0 for a consumer group without committed offsets.
    kafkaStartOffset: "latest"
  clickstreamStream:
    # Off: two Flink jobs (JM + TM each) do not fit on this VM.
    enabled: false
    # marketing: this is the clickstream funnel job.
    namespace: "marketing"
    # Built from the repo root with infra/docker/flink.Dockerfile.
    image: poc/flink-stream:0.1.0
    nodeSelector: {}
    jobManager:
      memory: "768m"
      cpu: 0.5
    taskManager:
      memory: "1024m"
      cpu: 0.5
      replicas: 1
    topic: "marketing.clickstream.raw"
    kafkaGroupId: "flink-clickstream-speed-group"
    kafkaStartOffset: "latest"
