# Data mesh governance: per-domain quotas and the Kyverno policies.

global:
  namespace: platform

# Kyverno itself is not installed by this chart: install it from its official
# chart first. enabled only gates the ClusterPolicies from governance/policies/*.yaml.
kyverno:
  enabled: true
  # Gate for the ClusterPolicies.
  policiesEnabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/kyverno/kyverno
    tag: "v1.11.4"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 192Mi

  # Empty schedules anywhere (multi-node: node-role.kubernetes.io/compute).
  nodeSelector: {}

# The DataContract/DataProduct definitions live in crds/, installed
# unconditionally. Single source of truth for the per-domain ResourceQuota/LimitRange.
domains:
  sales:
    enabled: true
    namespace: sales
    quotas:
      requestsCpu: "2000m"
      requestsMemory: "4Gi"
      limitsCpu: "4000m"
      limitsMemory: "6Gi"
      pods: "20"
      persistentvolumeclaims: "10"
  marketing:
    enabled: true
    namespace: marketing
    quotas:
      requestsCpu: "1500m"
      requestsMemory: "3Gi"
      limitsCpu: "3000m"
      limitsMemory: "5Gi"
      pods: "15"
      persistentvolumeclaims: "8"
  finance:
    enabled: true
    namespace: finance
    quotas:
      requestsCpu: "1000m"
      requestsMemory: "2Gi"
      limitsCpu: "2000m"
      limitsMemory: "4Gi"
      pods: "10"
      persistentvolumeclaims: "5"

policies:
  enforceContracts: true
  requireOwnerEmail: true
  validateQualityThresholds: true
