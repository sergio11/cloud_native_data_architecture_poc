# Ingestion layer: the PostgreSQL source and the bronze ingestion CronJob.

global:
  namespace: platform
  storageClass: "standard"

# PostgreSQL source.
postgresql:
  enabled: true
  replicaCount: 1
  image:
    repository: postgres
    tag: "16.2-alpine"
    pullPolicy: IfNotPresent

  auth:
    database: "poc_oltp"
    username: "postgres"
    password: "oltp_password_secret"

  service:
    type: ClusterIP
    port: 5432
    nodePort: 5432

  persistence:
    enabled: true
    storageClass: "standard"
    accessMode: ReadWriteOnce
    size: 2Gi

  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 384Mi

  # Tolerant on purpose: the default 1s timeout flaps under load.
  probes:
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 6
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 6

  # Empty schedules anywhere (multi-node: node-role.kubernetes.io/storage).
  nodeSelector: {}

  tolerations: []
  affinity: {}

# Bronze ingestion CronJob.
ingestionRunner:
  enabled: true
  schedule: "*/15 * * * *"  # Run every 15 minutes
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  image:
    # Built from the repo root with infra/docker/ingest.Dockerfile.
    repository: poc/ingest
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 192Mi
  env:
    # Names must match what src/adapters/source/oltp_source.py reads; unmatched
    # names make the CronJob fall back to the synthetic dataset.
    PGHOST: "postgres-oltp.platform.svc.cluster.local"
    PGPORT: "5432"
    PGDATABASE: "poc_oltp"
    PGUSER: "postgres"
    PGPASSWORD: "oltp_password_secret"
    # Read by src/container.py and the lineage adapter.
    MARQUEZ_URL: "http://marquez.platform.svc.cluster.local:5000"
    # Lakehouse port implementation: iceberg writes to Polaris and MinIO, sqlite to a file.
    LAKEHOUSE_BACKEND: "iceberg"
    # Name required by src/adapters/storage/iceberg_catalog.py.
    ICEBERG_CATALOG_URI: "http://polaris.platform.svc.cluster.local:8181/api/catalog"
    ICEBERG_CATALOG_NAME: "polaris"
    ICEBERG_WAREHOUSE: "polaris"
    POLARIS_OAUTH2_CREDENTIAL: "poc-admin:poc-admin-secret"
    POLARIS_OAUTH2_SCOPE: "PRINCIPAL_ROLE:ALL"
    MINIO_ENDPOINT: "http://minio.platform.svc.cluster.local:9000"
    MINIO_ACCESS_KEY: "minioadmin"
    MINIO_SECRET_KEY: "minioadmin"
    # The S3 client needs a region even against MinIO.
    MINIO_REGION: "us-east-1"
    # Used by the Trino serving adapter.
    TRINO_HOST: "trino.platform.svc.cluster.local"
    TRINO_PORT: "8080"
    TRINO_USER: "trino"
    TRINO_CATALOG: "iceberg"
    TRINO_SCHEMA: "serving"
