{{- if .Values.minio.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: {{ .Values.global.namespace | default "platform" }}
  labels:
    app: minio
    {{- include "s2-lakehouse.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.minio.replicaCount }}
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
        {{- include "s2-lakehouse.labels" . | nindent 8 }}
    spec:
      {{- with .Values.minio.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        # Bitnami images run as uid 1001; the PVC root must be writable by it.
        fsGroup: 1001
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: minio
          image: "{{ .Values.minio.image.repository }}:{{ .Values.minio.image.tag }}"
          imagePullPolicy: {{ .Values.minio.image.pullPolicy }}
          # Keep the image entrypoint and only override the server arguments.
          args:
            - server
            - /data
            - --console-address
            - :9001
          ports:
            - name: s3-api
              containerPort: 9000
              protocol: TCP
            - name: console
              containerPort: 9001
              protocol: TCP
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.minio.auth.rootUser | quote }}
            - name: MINIO_ROOT_PASSWORD
              value: {{ .Values.minio.auth.rootPassword | quote }}
            - name: MINIO_PROMETHEUS_AUTH_TYPE
              value: "public"
            # Drops MinIO's startup pre-allocation from 1GiB (the single-node
            # minimum) to ~256MiB. The chart caps this container at 384Mi
            # (values.yaml minio.resources.limits.memory), which is below the
            # 1GiB the server pre-allocates by default, so without this the
            # broker is OOMKilled on boot. It is the documented knob for
            # constrained single-node deployments, and the alternative -
            # raising the limit to 1Gi on a 6 GB node shared with Kafka, Flink
            # and Trino - is not affordable here.
            - name: MINIO_CI_CD
              value: "true"
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            # Without an explicit timeoutSeconds this probe gets the Kubernetes
            # default of 1s, which is shorter than the GC pause a busy MinIO
            # produces and flaps the pod for no reason.
            timeoutSeconds: 5
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            timeoutSeconds: 5
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        {{- if .Values.minio.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
{{- end }}
