# ==============================================================================
# Modern Data Architecture POC - Startup Profile: Stream
# File: infra/profiles/stream.yaml
# CONTRACT (K-B): each `subsystems.<chart>` is a verbatim Helm values fragment
# for infra/helm/<chart> (keys verified 1:1 against each chart's values.yaml).
# Only charts this profile deploys have a section (s1, s2, s4, s5).
# NOTE: s8 is NOT deployed by the stream path of profile-up.sh (observability
# for streaming stays on the demo profile until a profile explicitly wires it).
# Target RAM Footprint: workloads ~4.2 GB + ~1.3 GB control plane on a 6 GiB VM.
# Sum of container limits actually set here:
#   postgres 384 + minio 384 + polaris 512 + kafka 768
#   + flink-operator 384 + flink orders JM 768 + TM 1024  = 4224 MiB
# plus the transient bootstrap Jobs (bucket-init, polaris-schema, polaris
# bootstrap, kafka-topics) and the control plane, which shares the same 6 GiB.
# ==============================================================================
profile:
  name: "stream"
  description: "Real-time stream processing with Kafka, Apache Flink, and Observability"
  targetRamMb: 4224
  targetCpuCores: 4.0

subsystems:
  s1-ingestion:
    postgresql:
      enabled: true
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "384Mi"
    ingestionRunner:
      enabled: false

  s2-lakehouse:
    minio:
      enabled: true
      resources:
        requests:
          cpu: "150m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "384Mi"
    polaris:
      enabled: true
      resources:
        requests:
          cpu: "150m"
          memory: "384Mi"
        limits:
          cpu: "600m"
          memory: "512Mi"

  s4-stream:
    kafka:
      enabled: true
      resources:
        requests:
          cpu: "300m"
          memory: "512Mi"
        limits:
          cpu: "1000m"
          memory: "768Mi"
    kafkaUi:
      # OFF: a 256Mi container for a browser tab, on the profile that has to fit
      # a 6 GiB VM together with the control plane. Turn it on with -set once
      # there is headroom; it is a UI, not part of the data path.
      enabled: false
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "200m"
          memory: "256Mi"
    flinkOperator:
      enabled: true
      replicaCount: 1
      resources:
        requests:
          cpu: "150m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "384Mi"
    flinkJobs:
      ordersStream:
        enabled: true
        jobManager:
          # The operator rejects a JobManager below 768m (JVM heap + metaspace
          # + overhead), so these MUST NOT be lowered below the chart values.
          memory: "768m"
          cpu: 0.5
        taskManager:
          memory: "1024m"
          cpu: 0.5
          replicas: 1
      clickstreamStream:
        # OFF, deliberately. One Flink job is 768m + 1024m = 1792 MB of process
        # memory, so two jobs are 3584 MB - more than half the whole podman
        # machine. The profile below claims 6 GiB of target and also enabled
        # both jobs, which is why the box thrashed: the sum of container LIMITS
        # is what the JVMs size their heaps from (-Xms / MaxRAMPercentage), and
        # kind's three nodes each advertise ~5.79 GiB allocatable even though
        # they share one 6 GiB VM, so the scheduler overcommits and the kubelet
        # evicts whatever is unlucky. Run clickstream as its own phase.
        enabled: false
        jobManager:
          memory: "768m"
          cpu: 0.5
        taskManager:
          memory: "1024m"
          cpu: 0.5
          replicas: 1

  s5-serving:
    trino:
      enabled: false
