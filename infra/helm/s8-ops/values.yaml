# Operations and observability. Self-contained chart: only Prometheus and Grafana are rendered.

global:
  namespace: platform

grafana:
  enabled: true
  replicaCount: 1
  image:
    repository: grafana/grafana
    tag: 10.2.0
    pullPolicy: IfNotPresent
  admin:
    user: admin
    # Default only; override with --set grafana.admin.password=... .
    password: prom-operator
  service:
    type: NodePort
    port: 3000
    # Must match the 3000 port kind forwards to the host.
    nodePort: 3000
  resources:
    limits:
      cpu: "300m"
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "128Mi"

prometheus:
  enabled: true
  replicaCount: 1
  image:
    repository: prom/prometheus
    tag: v2.48.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9090
  scrapeInterval: 15s
  retention: 15d
  resources:
    limits:
      cpu: "300m"
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "128Mi"

