grafana:
  enabled: true
  replicaCount: 1
  image:
    repository: grafana/grafana
    tag: 10.2.0
  service:
    type: NodePort
    port: 3000
    nodePort: 30000
  resources:
    limits:
      cpu: "300m"
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "128Mi"

prometheus:
  enabled: true
  replicaCount: 1
  image:
    repository: prom/prometheus
    tag: v2.48.0
  service:
    type: ClusterIP
    port: 9090
  resources:
    limits:
      cpu: "300m"
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "128Mi"

metabase:
  enabled: true
  replicaCount: 1
  image:
    repository: metabase/metabase
    tag: v0.48.0
  service:
    type: NodePort
    port: 3000
    nodePort: 30003
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "256Mi"
