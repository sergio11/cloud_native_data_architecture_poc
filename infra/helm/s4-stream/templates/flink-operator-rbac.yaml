{{- if .Values.flinkOperator.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink-operator-sa
  namespace: {{ .Values.global.namespace | default "platform" }}
  labels:
    {{- include "s4-stream.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flink-operator-role
  labels:
    {{- include "s4-stream.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "persistentvolumeclaims", "events", "configmaps", "secrets"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["*"]
  - apiGroups: ["flink.apache.org"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flink-operator-role-binding
  labels:
    {{- include "s4-stream.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flink-operator-role
subjects:
  - kind: ServiceAccount
    name: flink-operator-sa
    namespace: {{ .Values.global.namespace | default "platform" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink-service-account
  namespace: {{ .Values.global.computeNamespace | default "sales" }}
  labels:
    {{- include "s4-stream.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink-role
  namespace: {{ .Values.global.computeNamespace | default "sales" }}
  labels:
    {{- include "s4-stream.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink-role-binding
  namespace: {{ .Values.global.computeNamespace | default "sales" }}
  labels:
    {{- include "s4-stream.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flink-role
subjects:
  - kind: ServiceAccount
    name: flink-service-account
    namespace: {{ .Values.global.computeNamespace | default "sales" }}
{{- end }}
