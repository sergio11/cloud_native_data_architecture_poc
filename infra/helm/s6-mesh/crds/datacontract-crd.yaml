# DataContract CRD. Lives in crds/, not templates/: Helm installs crds/ first and
# never templates it, so upgrades do not merge it and `helm uninstall` keeps instances.
# Sub-schemas are enumerated because a bare `type: object` prunes its children.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: datacontracts.dataplatform.io
  labels:
    app.kubernetes.io/name: s6-mesh
    app.kubernetes.io/part-of: modern-data-architecture-poc
spec:
  group: dataplatform.io
  names:
    kind: DataContract
    listKind: DataContractList
    plural: datacontracts
    singular: datacontract
    shortNames:
      - dc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - description
                - schema
              properties:
                description:
                  type: string
                compatibility_mode:
                  type: string
                sla:
                  type: object
                  properties:
                    freshness:
                      type: string
                    availability:
                      type: string
                    response_time_ms:
                      type: integer
                    support_hours:
                      type: string
                schema:
                  type: object
                  properties:
                    format:
                      type: string
                    ref:
                      type: string
                    primary_key:
                      type: array
                      items:
                        type: string
                    fields:
                      type: array
                      items:
                        type: object
                        required:
                          - name
                          - type
                        properties:
                          name:
                            type: string
                          type:
                            type: string
                          required:
                            type: boolean
                          description:
                            type: string
                quality:
                  type: object
                  properties:
                    thresholds:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      properties:
                        completeness:
                          type: number
                        uniqueness:
                          type: number
                        validity:
                          type: number
                    assertions:
                      type: array
                      items:
                        type: object
                        properties:
                          rule:
                            type: string
                          description:
                            type: string
                consumers:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      contact:
                        type: string
                      purpose:
                        type: string
      # The CRs are also written straight from the domain manifests.
      additionalPrinterColumns:
        - name: Version
          type: string
          jsonPath: .metadata.annotations["dataplatform\.io/version"]
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp