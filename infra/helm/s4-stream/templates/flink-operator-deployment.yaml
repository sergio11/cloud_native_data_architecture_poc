{{- if .Values.flinkOperator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-kubernetes-operator
  namespace: {{ .Values.global.namespace | default "platform" }}
  labels:
    app: flink-kubernetes-operator
    {{- include "s4-stream.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.flinkOperator.replicaCount }}
  selector:
    matchLabels:
      app: flink-kubernetes-operator
  template:
    metadata:
      labels:
        app: flink-kubernetes-operator
        {{- include "s4-stream.labels" . | nindent 8 }}
    spec:
      serviceAccountName: flink-operator-sa
      {{- with .Values.flinkOperator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: flink-operator
          image: "{{ .Values.flinkOperator.image.repository }}:{{ .Values.flinkOperator.image.tag }}"
          imagePullPolicy: {{ .Values.flinkOperator.image.pullPolicy }}
          # The upstream entrypoint requires the role as first argument (operator|webhook).
          args:
            - operator
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPERATOR_NAME
              value: flink-kubernetes-operator
            - name: FLINK_CONF_flink_k8s_operator_dynamic_namespaces_enabled
              value: "true"
          resources:
            {{- toYaml .Values.flinkOperator.resources | nindent 12 }}
          # The operator is a JVM that takes over a minute to bind 8085; a startupProbe
          # suspends liveness and readiness until it answers.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8085
            # The default 1s is shorter than a GC pause on a loaded JVM.
            timeoutSeconds: 10
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8085
            timeoutSeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8085
            timeoutSeconds: 10
            periodSeconds: 20
            failureThreshold: 6
{{- end }}
