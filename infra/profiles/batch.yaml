# ==============================================================================
# Modern Data Architecture POC - Startup Profile: Batch
# File: infra/profiles/batch.yaml
# Description: Batch processing profile activating foundational platform
#              services, Spark on K8s operator, Trino distributed SQL query
#              engine, Dagster pipeline orchestrator, and Great Expectations gates.
# Target RAM Footprint: ~6.5 GB RAM
# ==============================================================================
profile:
  name: "batch"
  description: "Medallion batch ETL, Trino SQL analytics, and Dagster orchestration"
  targetRamMb: 6656
  targetCpuCores: 4.5

subsystems:
  # S1: OLTP Demo Ingestion Source
  s1-ingestion:
    enabled: true
    replicas: 1
    resources:
      postgresql:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "384Mi"
      ingestionRunner:
        enabled: true
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "300m"
          memory: "256Mi"

  # S2: Lakehouse Storage and Iceberg Catalog
  s2-lakehouse:
    enabled: true
    replicas: 1
    resources:
      minio:
        requests:
          cpu: "150m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "384Mi"
      polaris:
        requests:
          cpu: "150m"
          memory: "384Mi"
        limits:
          cpu: "600m"
          memory: "512Mi"

  # S3: Batch Processing Engine (Spark Operator on K8s)
  s3-batch:
    enabled: true
    replicas: 1
    resources:
      sparkOperator:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "400m"
          memory: "384Mi"
      sparkDriver:
        memory: "1024m"
        cpu: 1.0
      sparkExecutor:
        memory: "1280m"
        cpu: 1.0
        instances: 1

  # S4: Stream Processing Engine (Disabled in Batch Profile)
  s4-stream:
    enabled: false
    replicas: 0
    resources:
      kafka:
        requests:
          cpu: "0m"
          memory: "0Mi"
        limits:
          cpu: "0m"
          memory: "0Mi"
      kafkaUi:
        enabled: false
      flinkOperator:
        enabled: false

  # S5: Serving Layer (Trino Coordinator + Worker in single node)
  s5-serving:
    enabled: true
    replicas: 1
    resources:
      trino:
        requests:
          cpu: "500m"
          memory: "1536Mi"
        limits:
          cpu: "1500m"
          memory: "2048Mi"
        jvmHeap: "1536M"

  # S6: Data Mesh Governance and Contracts
  s6-mesh:
    enabled: true
    replicas: 1
    resources:
      kyverno:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "300m"
          memory: "256Mi"

  # S7: Data Fabric & Lineage
  s7-fabric:
    enabled: true
    replicas: 1
    resources:
      marquez:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "384Mi"
      marquezDb:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "300m"
          memory: "256Mi"

  # S8: Operations, Orchestration & Observability (Dagster Orchestrator)
  s8-ops:
    enabled: true
    replicas: 1
    resources:
      dagster:
        enabled: true
        webserver:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "400m"
            memory: "384Mi"
        daemon:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
      prometheus:
        enabled: false
      grafana:
        enabled: false
      metabase:
        enabled: false
