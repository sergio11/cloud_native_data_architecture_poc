# Platform profile: storage, catalog, ingestion source and lineage services.
# Each `subsystems.<chart>` is a verbatim Helm values fragment for infra/helm/<chart>.
profile:
  name: "platform"
  description: "Base platform storage, catalog, messaging, and lineage services"
  targetRamMb: 3072
  targetCpuCores: 2.0

subsystems:
  s1-ingestion:
    postgresql:
      enabled: true
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "384Mi"
    ingestionRunner:
      enabled: false

  s2-lakehouse:
    minio:
      enabled: true
      resources:
        requests:
          cpu: "150m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "384Mi"
    polaris:
      enabled: true
      resources:
        requests:
          cpu: "150m"
          memory: "384Mi"
        limits:
          cpu: "600m"
          # Below ~1Gi the JVM spends its time in GC and never becomes ready.
          memory: "1024Mi"

  s7-fabric:
    marquez:
      enabled: true
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "384Mi"
