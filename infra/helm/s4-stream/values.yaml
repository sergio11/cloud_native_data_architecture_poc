# ==============================================================================
# Subsystem S4: Stream Processing Layer - Values Configuration
# File: infra/helm/s4-stream/values.yaml
# ==============================================================================

global:
  namespace: platform
  computeNamespace: sales
  storageClass: "standard"

kafka:
  enabled: true
  replicaCount: 1
  image:
    repository: apache/kafka
    tag: "3.7.0"
    pullPolicy: IfNotPresent

  # In-cluster bootstrap advertised to the Flink jobs. Without it the pods fall
  # back to localhost:9092 and find no broker.
  bootstrapServers: "kafka.platform.svc.cluster.local:9092"

  service:
    type: ClusterIP
    port: 9092

  persistence:
    enabled: true
    storageClass: "standard"
    size: 5Gi

  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: 800m
      memory: 768Mi

  # Empty by default so single-node clusters schedule anywhere (multi-node:
  # nodeSelector: {node-role.kubernetes.io/storage: "true"}).
  nodeSelector: {}

kafkaUi:
  enabled: true
  replicaCount: 1
  image:
    repository: provectuslabs/kafka-ui
    tag: "v0.7.2"
    pullPolicy: IfNotPresent

  service:
    type: NodePort
    port: 8090
    nodePort: 30090

  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 192Mi

topics:
  - name: "sales.orders.events"
    partitions: 3
    replicationFactor: 1
  - name: "marketing.clickstream.raw"
    partitions: 3
    replicationFactor: 1

flinkOperator:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/apache/flink-kubernetes-operator
    tag: "1.8.0"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      # The operator reconciles every FlinkDeployment on a 4-CPU node shared
      # with MinIO, Kafka, Trino and Spark; at 400m it was CPU-throttled into
      # missing its own health endpoint.
      cpu: 800m
      memory: 512Mi

  # Empty by default so single-node clusters schedule anywhere (multi-node:
  # nodeSelector: {node-role.kubernetes.io/compute: "true"}).
  nodeSelector: {}

# warehouse MUST match the Polaris defaultBaseLocation
# (s2-lakehouse/values.yaml -> polaris.config.warehouseLocation), else Flink and
# Polaris disagree about where the table files live.
icebergCatalog:
  name: "polaris"
  uri: "http://polaris.platform.svc.cluster.local:8181/api/catalog"
  warehouse: "s3://warehouse/"
  s3Endpoint: "http://minio.platform.svc.cluster.local:9000"
  s3AccessKey: "minioadmin"
  s3SecretKey: "minioadmin"
  # OAuth2 credential for Polaris 1.x REST catalog authentication.
  # Format "client_id:client_secret" — must match polaris.clientId/clientSecret
  # in s2-lakehouse/values.yaml and POLARIS_BOOTSTRAP_CREDENTIALS.
  oauth2Credential: "poc-admin:poc-admin-secret"

flinkJobs:
  ordersStream:
    enabled: true
    # Built from repo root: docker build -f infra/docker/flink.Dockerfile -t poc/flink-stream:0.1.0 .
    image: poc/flink-stream:0.1.0
    # Flink process memory must exceed JVM heap + metaspace + overhead;
    # 256m is rejected by the operator, 768m is the smallest workable value.
    jobManager:
      memory: "768m"
      cpu: 0.3
    taskManager:
      memory: "1024m"
      cpu: 0.4
      # Must live under taskManager: the template reads
      # flinkJobs.<job>.taskManager.replicas (a job-level value renders empty
      # and the CRD rejects it as null).
      replicas: 1
    topic: "sales.orders.events"
    kafkaGroupId: "flink-orders-speed-group"
    # 'earliest' re-reads the whole topic log from offset 0 (RF-10 Kappa
    # replay). It only replays from 0 when the consumer group has no committed
    # offsets, so a replay must also override kafkaGroupId with a fresh value.
    kafkaStartOffset: "latest"
  clickstreamStream:
    enabled: true
    # Built from repo root: docker build -f infra/docker/flink.Dockerfile -t poc/flink-stream:0.1.0 .
    image: poc/flink-stream:0.1.0
    jobManager:
      memory: "768m"
      cpu: 0.3
    taskManager:
      memory: "1024m"
      cpu: 0.4
      replicas: 1
    topic: "marketing.clickstream.raw"
    kafkaGroupId: "flink-clickstream-speed-group"
    kafkaStartOffset: "latest"
