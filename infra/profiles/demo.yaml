# ==============================================================================
# Modern Data Architecture POC - Startup Profile: Demo (RF-24 Full Suite)
# File: infra/profiles/demo.yaml
# CONTRACT (K-B): `subsystems.<chart>` is a verbatim Helm values fragment for
# infra/helm/<chart> (keys verified 1:1 against each chart's values.yaml).
# scripts/profile-up.sh extracts each section with python3/PyYAML to a temp
# file and passes it as `helm upgrade --install <chart> <chartdir> -f <tmp>`.
# Only charts this profile deploys have a section (all 8 here).
# S8 scope: prometheus+grafana only (dagster/metabase have no templates).
# S4 note: demo enables ordersStream only; clickstreamStream is explicitly
# disabled to stay within the RAM ceiling.
# RAM WARNING (RNF-01 / RC-02): with the Flink job enabled the sum of container
# LIMITS is ~8000 MB, ABOVE the old 7.5 GB ceiling. Cause is not tuning: the
# Flink operator rejects a JobManager under 768 MB, so the stream tier alone
# needs ~1.8 GB. RC-02's own mitigation (ADR-004) applies: run the heavy
# engines (Spark batch, Flink stream) SEQUENTIALLY. targetRamMb below is the
# real figure, not an aspirational one.
# ==============================================================================
profile:
  name: "demo"
  description: "RF-24 Full Architecture Demo - all subsystems, heavy engines run sequentially"
  targetRamMb: 8000
  targetCpuCores: 6.0

subsystems:
  s1-ingestion:
    postgresql:
      enabled: true
      resources:
        requests:
          cpu: "100m"
          memory: "192Mi"
        limits:
          cpu: "400m"
          memory: "384Mi"
    ingestionRunner:
      enabled: true
      resources:
        requests:
          cpu: "50m"
          memory: "96Mi"
        limits:
          cpu: "250m"
          memory: "192Mi"

  s2-lakehouse:
    minio:
      enabled: true
      resources:
        requests:
          cpu: "100m"
          memory: "192Mi"
        limits:
          cpu: "400m"
          memory: "384Mi"
    polaris:
      enabled: true
      # The 384Mi limit this profile used to set is below the floor the chart
      # itself documents (s2-lakehouse/values.yaml: Quarkus runs with
      # -XX:MaxRAMPercentage=80, and at 512Mi the JVM spends its time in GC and
      # never reaches ready). 384Mi is worse, so the startupProbe failed after
      # 600s and the catalog went CrashLoopBackOff.
      resources:
        requests:
          cpu: "150m"
          memory: "384Mi"
        limits:
          cpu: "600m"
          memory: "1024Mi"

  s3-batch:
    sparkOperator:
      enabled: true
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "250m"
          memory: "256Mi"
    sparkDefaults:
      driver:
        cores: 1
        coreLimit: "500m"
        memory: "512m"
      executor:
        cores: 1
        coreLimit: "500m"
        instances: 1
        memory: "640m"

  s4-stream:
    kafka:
      enabled: true
      resources:
        requests:
          cpu: "200m"
          memory: "384Mi"
        limits:
          cpu: "600m"
          memory: "768Mi"
    kafkaUi:
      enabled: true
      resources:
        requests:
          cpu: "50m"
          memory: "96Mi"
        limits:
          cpu: "150m"
          memory: "192Mi"
    flinkOperator:
      enabled: true
      replicaCount: 1
      # Was 300m / 256Mi. The Flink Kubernetes Operator is a Quarkus JVM:
      # 256Mi cannot hold a heap plus metaspace plus Netty direct buffers, so it
      # was OOMKilled and the demo reported "jobs never go RUNNING" instead of
      # an error. The 400m CPU floor is documented in
      # s4-stream/templates/flink-operator-deployment.yaml: below it the
      # operator was CPU-throttled into missing its own health endpoint.
      resources:
        requests:
          cpu: "200m"
          memory: "256Mi"
        limits:
          cpu: "800m"
          memory: "512Mi"
    flinkJobs:
      ordersStream:
        enabled: true
        jobManager:
          # Floor imposed by the Flink operator (see values.yaml).
          memory: "768m"
          cpu: 0.4
        taskManager:
          memory: "1024m"
          cpu: 0.4
          replicas: 1
      clickstreamStream:
        enabled: false

  s5-serving:
    trino:
      enabled: true
      # Heap must leave room for metaspace and direct buffers inside the
      # container limit. 1024M in 1280Mi is exactly the combination
      # s5-serving/values.yaml calls out as an OOM risk, and the chart runs with
      # -XX:+ExitOnOutOfMemoryError, so the first heap excursion kills the pod.
      # 896M gives ~384MiB of headroom, which is what the chart ships.
      resources:
        requests:
          cpu: "400m"
          memory: "896Mi"
        limits:
          cpu: "1200m"
          memory: "1280Mi"
      jvm:
        maxHeapSize: "896M"

  s6-mesh:
    kyverno:
      enabled: true
      policiesEnabled: true
      resources:
        requests:
          cpu: "50m"
          memory: "96Mi"
        limits:
          cpu: "200m"
          memory: "192Mi"

  s7-fabric:
    marquez:
      enabled: true
      resources:
        requests:
          cpu: "100m"
          memory: "192Mi"
        limits:
          cpu: "350m"
          memory: "320Mi"

  s8-ops:
    prometheus:
      enabled: true
      resources:
        requests:
          cpu: "100m"
          memory: "160Mi"
        limits:
          cpu: "300m"
          memory: "256Mi"
    grafana:
      enabled: true
      resources:
        requests:
          cpu: "50m"
          memory: "96Mi"
        limits:
          cpu: "200m"
          memory: "192Mi"
