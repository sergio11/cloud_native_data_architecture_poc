apiVersion: v1
kind: List
items:
  # Sales Domain Quotas
  - apiVersion: v1
    kind: ResourceQuota
    metadata:
      name: domain-compute-quota
      namespace: sales
    spec:
      hard:
        requests.cpu: "2"
        requests.memory: 2Gi
        limits.cpu: "4"
        limits.memory: 4Gi
        pods: "15"

  # Marketing Domain Quotas
  - apiVersion: v1
    kind: ResourceQuota
    metadata:
      name: domain-compute-quota
      namespace: marketing
    spec:
      hard:
        requests.cpu: "1"
        requests.memory: 1Gi
        limits.cpu: "2"
        limits.memory: 2Gi
        pods: "10"

  # Finance Domain Quotas
  - apiVersion: v1
    kind: ResourceQuota
    metadata:
      name: domain-compute-quota
      namespace: finance
    spec:
      hard:
        requests.cpu: "1"
        requests.memory: 1Gi
        limits.cpu: "2"
        limits.memory: 2Gi
        pods: "10"
