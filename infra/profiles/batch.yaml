# ==============================================================================
# Modern Data Architecture POC - Startup Profile: Batch
# File: infra/profiles/batch.yaml
# CONTRACT (K-B): each `subsystems.<chart>` is a verbatim Helm values fragment
# for infra/helm/<chart> (keys verified 1:1 against each chart's values.yaml).
# Only charts this profile deploys have a section (s1, s2, s3, s5).
# NOTE: s8 is NOT deployed by the batch path of profile-up.sh; the old
# dagster-only s8 section is dropped (dagster has no templates/values).
# Target RAM Footprint: ~6.5 GB RAM
# ==============================================================================
profile:
  name: "batch"
  description: "Medallion batch ETL, Trino SQL analytics, and Dagster orchestration"
  targetRamMb: 6656
  targetCpuCores: 4.5

subsystems:
  s1-ingestion:
    postgresql:
      enabled: true
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "384Mi"
    ingestionRunner:
      enabled: true
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "300m"
          memory: "256Mi"

  s2-lakehouse:
    minio:
      enabled: true
      resources:
        requests:
          cpu: "150m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "384Mi"
    polaris:
      enabled: true
      resources:
        requests:
          cpu: "150m"
          memory: "384Mi"
        limits:
          cpu: "600m"
          # Raised from 512Mi, which is exactly the floor s2-lakehouse documents
          # as "spends its time in GC and never reaches ready". Limits do not
          # affect scheduling (only requests do), so this costs nothing.
          memory: "1024Mi"

  s3-batch:
    sparkOperator:
      enabled: true
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "400m"
          memory: "384Mi"
    sparkDefaults:
      driver:
        cores: 1
        coreLimit: "1000m"
        memory: "1024m"
      executor:
        cores: 1
        coreLimit: "1000m"
        instances: 1
        memory: "1280m"

  s5-serving:
    trino:
      enabled: true
      resources:
        requests:
          cpu: "500m"
          memory: "1536Mi"
        limits:
          cpu: "1500m"
          memory: "2048Mi"
      jvm:
        maxHeapSize: "1536M"
