{{- if .Values.flinkOperator.enabled }}
{{- /*
Namespaces that need a Flink ServiceAccount, one per enabled job from the job's
own namespace; hardcoding global.computeNamespace would put the marketing job in
the sales namespace.
*/}}
{{- $flinkNamespaces := list }}
{{- if .Values.flinkJobs.ordersStream.enabled }}
{{- $flinkNamespaces = append $flinkNamespaces (.Values.flinkJobs.ordersStream.namespace | default .Values.global.computeNamespace) }}
{{- end }}
{{- if .Values.flinkJobs.clickstreamStream.enabled }}
{{- $flinkNamespaces = append $flinkNamespaces (.Values.flinkJobs.clickstreamStream.namespace | default "marketing") }}
{{- end }}
{{- $flinkNamespaces = $flinkNamespaces | uniq }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink-operator-sa
  namespace: {{ .Values.global.namespace | default "platform" }}
  labels:
    {{- include "s4-stream.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flink-operator-role
  labels:
    {{- include "s4-stream.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "persistentvolumeclaims", "events", "configmaps", "secrets"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["*"]
  - apiGroups: ["flink.apache.org"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flink-operator-role-binding
  labels:
    {{- include "s4-stream.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flink-operator-role
subjects:
  - kind: ServiceAccount
    name: flink-operator-sa
    namespace: {{ .Values.global.namespace | default "platform" }}
{{- range $ns := $flinkNamespaces }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink-service-account
  namespace: {{ $ns }}
  labels:
    {{- include "s4-stream.labels" $ | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink-role
  namespace: {{ $ns }}
  labels:
    {{- include "s4-stream.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink-role-binding
  namespace: {{ $ns }}
  labels:
    {{- include "s4-stream.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flink-role
subjects:
  - kind: ServiceAccount
    name: flink-service-account
    namespace: {{ $ns }}
{{- end }}
{{- end }}
