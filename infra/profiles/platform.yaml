# ==============================================================================
# Modern Data Architecture POC - Startup Profile: Platform
# File: infra/profiles/platform.yaml
# CONTRACT (K-B): each `subsystems.<chart>` is a verbatim Helm values fragment
# for infra/helm/<chart> (keys verified 1:1 against each chart's values.yaml).
# Only charts this profile deploys have a section (s1, s2, s7).
# Target RAM Footprint: ~3.0 GB RAM
# ==============================================================================
profile:
  name: "platform"
  description: "Base platform storage, catalog, messaging, and lineage services"
  targetRamMb: 3072
  targetCpuCores: 2.0

subsystems:
  s1-ingestion:
    postgresql:
      enabled: true
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "384Mi"
    ingestionRunner:
      enabled: false

  s2-lakehouse:
    minio:
      enabled: true
      resources:
        requests:
          cpu: "150m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "384Mi"
    polaris:
      enabled: true
      resources:
        requests:
          cpu: "150m"
          memory: "384Mi"
        limits:
          cpu: "600m"
          memory: "512Mi"

  s7-fabric:
    marquez:
      enabled: true
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "384Mi"
