# ==============================================================================
# Modern Data Architecture POC - Startup Profile: Stream
# File: infra/profiles/stream.yaml
# CONTRACT (K-B): each `subsystems.<chart>` is a verbatim Helm values fragment
# for infra/helm/<chart> (keys verified 1:1 against each chart's values.yaml).
# Only charts this profile deploys have a section (s1, s2, s4).
# NOTE: s8 is NOT deployed by the stream path of profile-up.sh (observability
# for streaming stays on the demo profile until a profile explicitly wires it).
# Trino is not part of this profile either: it is the serving phase
# (infra/profiles/serving.yaml).
# Target RAM Footprint: workloads ~2.5 GB + ~3.5 GB of kind overhead on a
# 5.9 GiB VM.
#
# The three kind node CONTAINERS are not free: measured from the host, the
# control-plane container alone is 2.0 GB and each worker ~1.6 GB, so the
# cluster itself costs ~3.5 GB before a single application pod starts. That
# leaves ~2.4 GB for everything else, and every kind node REPORTS ~5.79 GiB
# of allocatable memory (they all see the same VM), so the scheduler happily
# commits 17.4 GiB on a 5.9 GiB machine and the kubelet then evicts whatever
# is unlucky. The limits below are the budget that actually fits:
#
#   minio 320 + polaris 384 + kafka 448 + flink-operator 192
#   + flink orders JM 640 + TM 640                     = 2624 MiB
#
# and the heavy phase additionally STOPS the "worker" kind node (see
# `rake ramp:stream`), which frees 1.5 GB and is what makes this fit.
# ==============================================================================
profile:
  name: "stream"
  description: "Real-time stream processing with Kafka, Apache Flink, and Observability"
  targetRamMb: 2624
  targetCpuCores: 4.0

subsystems:
  s1-ingestion:
    postgresql:
      enabled: true
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "384Mi"
    ingestionRunner:
      enabled: false

  s2-lakehouse:
    minio:
      enabled: true
      resources:
        requests:
          cpu: "150m"
          memory: "256Mi"
        limits:
          cpu: "400m"
          # 320Mi was not enough once the speed layer starts committing small
          # parquet files every checkpoint: MinIO was SIGKILLed (exit 137) and
          # the probes and the Iceberg readers lost the broker mid-flight.
          memory: "448Mi"
    polaris:
      enabled: true
      resources:
        requests:
          cpu: "150m"
          memory: "256Mi"
        limits:
          cpu: "600m"
          memory: "384Mi"

  s4-stream:
    kafka:
      enabled: true
      # The broker's RSS is its heap plus its direct buffers, so the heap has
      # to come down with the limit: 256m + 64m + metaspace fits in 448Mi.
      #
      # 192m is NOT enough: the broker died at boot with
      #   java.lang.OutOfMemoryError: Java heap space
      #   at org.apache.kafka.storage.internals.log.SkimpyOffsetMap.<init>
      # while starting the LogManager.
      heapOpts: "-Xms192m -Xmx256m -XX:MaxDirectMemorySize=64m"
      resources:
        requests:
          cpu: "300m"
          memory: "320Mi"
        limits:
          cpu: "800m"
          memory: "448Mi"
    kafkaUi:
      # OFF: a 256Mi container for a browser tab, on the profile that has to fit
      # a 6 GiB VM together with the control plane. Turn it on with -set once
      # there is headroom; it is a UI, not part of the data path.
      enabled: false
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "200m"
          memory: "256Mi"
    flinkOperator:
      enabled: true
      replicaCount: 1
      # 384Mi, NOT less. The operator is a Quarkus JVM and it was OOM-killed
      # at 192Mi:
      #   OOMKilled exit=137
      # which looked like a Flink problem (the deployment never got created
      # and the operator retried the submission every two minutes) and was
      # not one. The chart's own default is 512Mi.
      resources:
        requests:
          cpu: "150m"
          memory: "256Mi"
        limits:
          cpu: "400m"
          memory: "384Mi"
    flinkJobs:
      ordersStream:
        enabled: true
        # Pinned to the compute node: the Flink image is 1.7 GB and it only
        # has to be loaded where the job runs. The operator's own image is
        # only on that node too.
        nodeSelector:
          kubernetes.io/hostname: poc-data-platform-worker2
        jobManager:
          # The operator rejects a JobManager below 768m (JVM heap + metaspace
          # + overhead), so these MUST NOT be lowered below the chart values.
          memory: "768m"
          cpu: 0.5
        taskManager:
          # 1024m, NOT lower. Flink's TaskManager has fixed costs that do not
          # scale with the memory you give it: framework heap (128m) +
          # framework off-heap (128m) + network (64m) = 320m BEFORE any task
          # heap, plus the managed memory. At 640m the process only had
          # 192m of "Total Flink Memory" left for 396m of mandatory
          # components, and the operator refused to submit the job:
          #
          #   TaskManager memory configuration failed: Sum of configured
          #   Framework Heap Memory (128.000mb), Framework Off-Heap Memory
          #   (128.000mb), Task Off-Heap Memory (0 bytes), Managed Memory
          #   (76.800mb) and Network Memory (64.000mb) exceed configured
          #   Total Flink Memory (192.000mb)
          #
          # At 1024m there are ~665m of Flink memory for 586m of components.
          memory: "1024m"
          cpu: 0.5
          replicas: 1
      clickstreamStream:
        # OFF, deliberately. One Flink job is 768m + 1024m = 1792 MB of process
        # memory, so two jobs are 3584 MB - more than half the whole podman
        # machine. The profile below claims 6 GiB of target and also enabled
        # both jobs, which is why the box thrashed: the sum of container LIMITS
        # is what the JVMs size their heaps from (-Xms / MaxRAMPercentage), and
        # kind's three nodes each advertise ~5.79 GiB allocatable even though
        # they share one 6 GiB VM, so the scheduler overcommits and the kubelet
        # evicts whatever is unlucky. Run clickstream as its own phase.
        enabled: false
        jobManager:
          memory: "768m"
          cpu: 0.5
        taskManager:
          memory: "1024m"
          cpu: 0.5
          replicas: 1

  # NOTE: no s5-serving section. Trino belongs to the serving phase
  # (infra/profiles/serving.yaml): 6 GiB cannot hold Flink and Trino at the
  # same time, and the speed layer is readable from the lakehouse without
  # the serving layer being up.
