# Lakehouse rows probe Job (rake lakehouse:rows)
#
# One pod that reads the Iceberg catalogue and medallion tables and reports how
# many rows each tier really has, straight from the lakehouse.
apiVersion: batch/v1
kind: Job
metadata:
  name: lakehouse-rows-probe
  namespace: platform
  labels:
    app: lakehouse-rows-probe
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: lakehouse-rows-probe
    spec:
      restartPolicy: Never
      # Pinned to the compute node, where the ingestion image is loaded and which stays up.
      nodeSelector:
        kubernetes.io/hostname: poc-data-platform-worker2
      volumes:
        - name: script
          configMap:
            name: lakehouse-rows-probe
      containers:
        - name: probe
          image: docker.io/poc/ingest:0.1.0
          imagePullPolicy: Never
          workingDir: /app
          env:
            - name: POC_REPO_ROOT
              value: /app
            # The lakehouse port resolves to the Iceberg implementation.
            - name: LAKEHOUSE_BACKEND
              value: iceberg
            - name: ICEBERG_CATALOG_URI
              value: http://polaris.platform.svc.cluster.local:8181/api/catalog
            - name: ICEBERG_CATALOG_NAME
              value: polaris
            - name: POLARIS_OAUTH2_CREDENTIAL
              value: poc-admin:poc-admin-secret
            # Polaris requires this scope; the client default "catalog" is rejected.
            - name: POLARIS_OAUTH2_SCOPE
              value: PRINCIPAL_ROLE:ALL
            - name: MINIO_ENDPOINT
              value: http://minio.platform.svc.cluster.local:9000
            - name: MINIO_ACCESS_KEY
              value: minioadmin
            - name: MINIO_SECRET_KEY
              value: minioadmin
            - name: MINIO_REGION
              value: us-east-1
            # Tiers required to pass; the stream tier belongs to another phase.
            - name: EXPECTED_TIERS
              value: bronze,silver,gold
          volumeMounts:
            - name: script
              mountPath: /probe
              readOnly: true
          command:
            - /bin/sh
            - -c
            - |
              set -x
              python3 /probe/lakehouse_rows_probe.py
              echo "PROBE_EXIT=$?"
