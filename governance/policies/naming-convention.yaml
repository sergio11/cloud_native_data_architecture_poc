apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: enforce-mesh-naming-conventions
  annotations:
    policies.kyverno.io/title: Enforce Data Mesh Naming Conventions
    policies.kyverno.io/category: Architecture Standards
    policies.kyverno.io/severity: medium
spec:
  validationFailureAction: Enforce
  rules:
    - name: validate-product-naming
      match:
        any:
          - resources:
              kinds:
                - DataProduct
      validate:
        # Kyverno pattern wildcards (*, ?, ?*) have NO character classes and
        # every other character is matched literally, so a pattern value such
        # as "?*([a-z0-9-])" would only match names literally ending in
        # "([a-z0-9-])" (i.e. nothing), while a bare "?*" would also accept
        # "-leading", "UPPER" or dotted names. The rule is therefore expressed
        # as a regex deny condition, which is the only place Kyverno accepts a
        # real character class ([a-z0-9_-]).
        message: >-
          DataProduct name must start with a lowercase alphanumeric character and may
          then contain only lowercase alphanumeric characters, hyphens or underscores
          (regex ^[a-z0-9][a-z0-9_-]*$), e.g. orders, customers, financial_closings.
        deny:
          conditions:
            all:
              - key: "{{ regex_match('^[a-z0-9][a-z0-9_-]*$', request.object.metadata.name || '') }}"
                operator: Equals
                value: false
                message: >-
                  DataProduct metadata.name does not match ^[a-z0-9][a-z0-9_-]*$
                  (lowercase alphanumeric start; hyphens and underscores allowed afterwards).
