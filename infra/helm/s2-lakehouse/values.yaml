# ==============================================================================
# Subsystem S2: Lakehouse Storage & Catalog - Values Configuration
# File: infra/helm/s2-lakehouse/values.yaml
# ==============================================================================

global:
  namespace: platform
  storageClass: "standard"

# MinIO S3 Object Storage
minio:
  enabled: true
  replicaCount: 1
  image:
    # Upstream minio/minio was removed from Docker Hub and quay.io gates
    # anonymous pulls, so the POC uses the archived Bitnami build.
    repository: bitnamilegacy/minio
    tag: "2025.7.23"
    pullPolicy: IfNotPresent

  auth:
    rootUser: "minioadmin"
    rootPassword: "minioadmin"

  service:
    type: NodePort
    apiPort: 9000
    apiNodePort: 30900
    consolePort: 9001
    consoleNodePort: 30901

  persistence:
    enabled: true
    storageClass: "standard"
    accessMode: ReadWriteOnce
    size: 10Gi

  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 384Mi

  # Empty by default so single-node clusters schedule anywhere; pin to
  # storage nodes in multi-node setups, e.g.
  # nodeSelector: {node-role.kubernetes.io/storage: "true"}.
  nodeSelector: {}

  tolerations: []
  affinity: {}

# Automatic Lakehouse Buckets Provisioning
bucketInit:
  enabled: true
  image:
    # Client for the bucket-init job; upstream minio/mc is gone from Docker Hub.
    repository: bitnamilegacy/minio-client
    tag: "2025.7.21"
    pullPolicy: IfNotPresent
  buckets:
    - datalake
    - warehouse
    - bronze
    - silver
    - gold
    - stream
    - contracts
    - checkpoints

# Apache Polaris REST Iceberg Catalog
polaris:
  enabled: true
  replicaCount: 1
  image:
    repository: apache/polaris
    # Pinned (RNF-09). "latest" silently moved to 1.8.0 and 2.x will break the
    # configuration below, which is written against the 1.8 Quarkus runtime.
    tag: "1.8.0"
    pullPolicy: IfNotPresent

  service:
    type: NodePort
    port: 8181
    nodePort: 31818

  # Realm and fixed root credentials handed to Polaris via
  # POLARIS_BOOTSTRAP_CREDENTIALS. Without them Polaris generates a random pair
  # on every boot, so Trino, Flink and Spark can never be pointed at it. These
  # same values must be given to every Iceberg REST client.
  realm: "POLARIS"
  clientId: "poc-admin"
  clientSecret: "poc-admin-secret"

  # Durable catalog metadata. Without it the catalog is wiped on every Polaris
  # restart and the Iceberg tables in MinIO become invisible to every engine.
  #
  # type: "jdbc" is what actually turns persistence on (the deployment maps it to
  # POLARIS_PERSISTENCE_TYPE). "in-memory" is the previous, broken behaviour.
  #
  # PostgreSQL is not a preference: the JDBC driver in apache/polaris:1.8.0 is
  # org.postgresql + quarkus-jdbc-postgresql and the image ships no H2 driver.
  # This reuses the Postgres the cluster already runs (s1-ingestion -> postgres-oltp)
  # instead of adding a pod to a 6 GB node; the credentials must match its env.
  persistence:
    # "in-memory" for now, "relational-jdbc" is the durable target.
    #
    # relational-jdbc boots, connects and reads its schema (schema v6 from the
    # polaris-relational-jdbc-1.8.0 jar, applied by polaris-db-schema-job.yaml,
    # with ?currentSchema=public). It stops at one step: with a JDBC metastore
    # Polaris does NOT bootstrap the realm on startup the way it does in-memory
    # - it answers "Realm POLARIS is not bootstrapped... Please run Bootstrap
    # command", and `java -jar quarkus-run.jar Bootstrap` is silently ignored,
    # so it starts the server instead of bootstrapping. The command lives in the
    # 424 MB binary distribution (polaris-bin-1.8.0.tgz); no admin-tool artifact
    # is published to Maven Central. That download is the next step once the
    # speed layer is verified end to end.
    #
    # Until then the catalog is recreated by polaris-bootstrap-job.yaml after
    # every Polaris restart.
    type: "in-memory"
    driver: "org.postgresql.Driver"
    # Reuses the PostgreSQL the cluster already runs (s1-ingestion ->
    # postgres-oltp) instead of adding a pod to a 6 GB node. Plain literals:
    # values.yaml is YAML, Helm does not evaluate templates inside it, and the
    # host must follow a change of global.namespace by hand.
    host: "postgres-oltp.platform.svc.cluster.local"
    database: "poc_oltp"
    username: "postgres"
    password: "oltp_password_secret"
    # currentSchema pins the schema explicitly: Polaris reports
    # `relation "entities" does not exist` even though the table is in public and
    # the connection is to the right database, which is what an unset/foreign
    # search_path looks like from the driver's side.
    jdbcUrl: "jdbc:postgresql://postgres-oltp.platform.svc.cluster.local:5432/poc_oltp?currentSchema=public"
    # Small on purpose: the node has 6 GB shared by everything and Polaris only
    # issues a handful of metadata queries.
    poolMaxSize: 10

  config:
    realm: "default-realm"
    defaultCatalog: "polaris"
    warehouseLocation: "s3://warehouse/"
    s3Endpoint: "http://minio.platform.svc.cluster.local:9000"
    awsRegion: "us-east-1"
    accessKey: "minioadmin"
    secretKey: "minioadmin"

  resources:
    requests:
      cpu: 200m
      # Quarkus runs with -XX:MaxRAMPercentage=80 + ExitOnOutOfMemoryError, so
      # the limit IS the heap budget. At 512Mi the JVM spends its time in GC
      # and the first boot against the JDBC metastore never reaches ready.
      memory: 512Mi
    limits:
      cpu: 800m
      memory: 1024Mi

  # Empty by default so single-node clusters schedule anywhere; pin to
  # storage nodes in multi-node setups, e.g.
  # nodeSelector: {node-role.kubernetes.io/storage: "true"}.
  nodeSelector: {}

  tolerations: []
  affinity: {}

# Shared Lakehouse Storage PVC (used across batch medallion, streaming, and serving jobs)
lakehouseStorage:
  enabled: true
  name: "lakehouse-storage"
  accessMode: "ReadWriteOnce"
  storageClass: "standard"
  size: "2Gi"

