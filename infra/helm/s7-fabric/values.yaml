marquez:
  enabled: true
  replicaCount: 1
  image:
    repository: marquezproject/marquez
    tag: 0.45.0
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    apiPort: 5000
    webPort: 3000
    # Belongs on the WEB port (what kind forwards as 3002), not the API port.
    nodePortWeb: 3002
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "256Mi"

# Marquez's catalog database: the image defaults to a host called "postgres".
marquezPostgres:
  enabled: true
  image:
    repository: postgres
    tag: "16.2-alpine"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "500m"
      memory: "384Mi"
    requests:
      cpu: "100m"
      memory: "192Mi"
  pvc:
    name: marquez-postgresql-data
    size: 1Gi
    storageClass: "standard"

alertService:
  enabled: true
  replicaCount: 1
  image:
    # Build context is lineage/config:
    #   docker build -f lineage/config/Dockerfile -t poc/lineage-webhook:0.1.0 lineage/config/
    repository: poc/lineage-webhook
    tag: 0.1.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: "300m"
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"
  # SQLite store behind LINEAGE_DB_PATH.
  persistence:
    enabled: true
    size: 1Gi
    storageClass: "standard"
