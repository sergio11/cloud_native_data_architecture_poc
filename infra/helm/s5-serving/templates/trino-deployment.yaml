{{- if .Values.trino.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino
  namespace: {{ .Values.global.namespace | default "platform" }}
  labels:
    app: trino
    {{- include "s5-serving.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.trino.replicaCount }}
  selector:
    matchLabels:
      app: trino
  template:
    metadata:
      labels:
        app: trino
        {{- include "s5-serving.labels" . | nindent 8 }}
      annotations:
        # Without this, editing catalogs.iceberg.* in values.yaml updates the
        # ConfigMap but leaves the running pod on the OLD catalog: no restart,
        # no error, and the change appears to have been ignored. The rollout is
        # driven by the ConfigMap content, not by the Deployment spec.
        checksum/config: {{ include (print $.Template.BasePath "/trino-configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.trino.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: trino-coordinator
          image: "{{ .Values.trino.image.repository }}:{{ .Values.trino.image.tag }}"
          imagePullPolicy: {{ .Values.trino.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            {{- toYaml .Values.trino.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/trino
            - name: catalog
              mountPath: /etc/trino/catalog
            - name: data
              mountPath: /data/trino
          startupProbe:
            httpGet:
              path: /v1/info
              port: 8080
            # Explicit because the Kubernetes default is 1s, which is shorter
            # than a GC pause on a loaded JVM (see polaris-deployment.yaml).
            timeoutSeconds: 10
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /v1/info
              port: 8080
            timeoutSeconds: 10
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/info
              port: 8080
            timeoutSeconds: 10
            periodSeconds: 20
            failureThreshold: 5
      volumes:
        - name: config
          configMap:
            name: trino-config
            items:
              - key: node.properties
                path: node.properties
              - key: jvm.config
                path: jvm.config
              - key: config.properties
                path: config.properties
        - name: catalog
          configMap:
            name: trino-config
            items:
              - key: iceberg.properties
                path: iceberg.properties
              - key: kafka.properties
                path: kafka.properties
        - name: data
          emptyDir: {}
{{- end }}
