{{- if .Values.polaris.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polaris
  namespace: {{ .Values.global.namespace | default "platform" }}
  labels:
    app: polaris
    {{- include "s2-lakehouse.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.polaris.replicaCount }}
  selector:
    matchLabels:
      app: polaris
  template:
    metadata:
      labels:
        app: polaris
        {{- include "s2-lakehouse.labels" . | nindent 8 }}
    spec:
      {{- with .Values.polaris.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-minio
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for MinIO on port 9000..."
              until nc -z -w 2 minio.{{ .Values.global.namespace | default "platform" }}.svc.cluster.local 9000; do
                sleep 2
              done
              echo "MinIO reachable."
      containers:
        - name: polaris
          image: "{{ .Values.polaris.image.repository }}:{{ .Values.polaris.image.tag }}"
          imagePullPolicy: {{ .Values.polaris.image.pullPolicy }}
          ports:
            - name: rest-api
              containerPort: 8181
              protocol: TCP
            # Quarkus management interface: this is where /q/health lives.
            # The catalog API on 8181 requires authentication and is the wrong
            # target for a kubelet probe.
            - name: management
              containerPort: 8182
              protocol: TCP
          env:
            # Metastore. Quarkus env mapping: a double underscore is one nesting
            # level, so POLARIS_PERSISTENCE_JDBC__CONNECTION__URL is
            # polaris.persistence.jdbc.connection.url.
            #
            # This used to be the in-memory metastore with a comment explaining
            # that JDBC never came up on this cluster. That conclusion was drawn
            # from a 15-minute timeout imposed by the liveness probe, not from the
            # metastore: the probe killed Polaris during the first Hibernate
            # schema mapping. The startupProbe below now allows 10 minutes, so
            # the JDBC path is given the time it needs, and the catalog survives
            # restarts instead of vanishing and taking the speed layer with it.
            - name: POLARIS_PERSISTENCE_TYPE
              value: {{ .Values.polaris.persistence.type | quote }}
            {{- if ne .Values.polaris.persistence.type "in-memory" }}
            # Env mapping: a DOTS in the property name becomes ONE underscore, not
            # two. `quarkus.datasource.jdbc.url` is QUARKUS_DATASOURCE_JDBC_URL and
            # `polaris.persistence.jdbc.connection.url` is
            # POLARIS_PERSISTENCE_JDBC_CONNECTION_URL. A doubled underscore is only
            # how a literal underscore inside a property name is escaped, and
            # writing __ silently produced an unknown property that Quarkus ignored -
            # which is why the datasource still reported "URL is not set".
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: {{ .Values.polaris.persistence.jdbcUrl | quote }}
            - name: QUARKUS_DATASOURCE_USERNAME
              value: {{ .Values.polaris.persistence.username | quote }}
            - name: QUARKUS_DATASOURCE_PASSWORD
              value: {{ .Values.polaris.persistence.password | quote }}
            - name: QUARKUS_DATASOURCE_JDBC_DRIVER
              value: {{ .Values.polaris.persistence.driver | quote }}
            - name: POLARIS_PERSISTENCE_JDBC_CONNECTION_URL
              value: {{ .Values.polaris.persistence.jdbcUrl | quote }}
            - name: POLARIS_PERSISTENCE_JDBC_CONNECTION_DRIVER
              value: {{ .Values.polaris.persistence.driver | quote }}
            - name: POLARIS_PERSISTENCE_JDBC_CONNECTION_USER
              value: {{ .Values.polaris.persistence.username | quote }}
            - name: POLARIS_PERSISTENCE_JDBC_CONNECTION_PASSWORD
              value: {{ .Values.polaris.persistence.password | quote }}
            - name: POLARIS_PERSISTENCE_JDBC_CONNECTION_POOL_MAX_SIZE
              value: {{ .Values.polaris.persistence.poolMaxSize | quote }}
            # Schema management. Without it Polaris connects fine but every query
            # fails with `relation "entities" does not exist`. Polaris 1.8 maps
            # the tables with Hibernate (not Flyway - no migration ever ran and
            # the database stayed empty), so it is Hibernate's own DDL export
            # that has to be enabled.
            - name: POLARIS_PERSISTENCE_JDBC_SCHEMA_MANAGEMENT_TYPE
              value: "hibernate"
            - name: QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION
              value: "update"
            {{- end }}
            # Fixed root credentials. Without these Polaris generates a random
            # pair on every boot and only prints it to stdout, so no Iceberg
            # client could ever be pointed at it. Format per
            # RootCredentialsSet.fromString() is "realm,clientId,clientSecret"
            # with ";" between realms. Anything else fails fast with
            # "Invalid credentials format" and the server exits.
            - name: POLARIS_BOOTSTRAP_CREDENTIALS
              value: "{{ .Values.polaris.realm }},{{ .Values.polaris.clientId }},{{ .Values.polaris.clientSecret }}"
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.polaris.config.accessKey | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              value: {{ .Values.polaris.config.secretKey | quote }}
            - name: AWS_REGION
              value: {{ .Values.polaris.config.awsRegion | quote }}
          resources:
            {{- toYaml .Values.polaris.resources | nindent 12 }}
          # Polaris 1.8 takes ~80 s to boot on the in-memory metastore and
          # several minutes on the first JDBC-mapped start (Hibernate schema
          # creation). With initialDelay 20 s and the default failureThreshold
          # of 3, the old liveness probe killed it at ~80 s, every time, before
          # it could serve a single request: 105 restarts and a permanent
          # CrashLoopBackOff. A startupProbe suspends liveness and readiness
          # until the server is genuinely up, which is the only correct way to
          # express a slow boot. Budget: 5 s x 120 = 10 minutes.
          startupProbe:
            httpGet:
              path: /q/health/ready
              port: 8182
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8182
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8182
            periodSeconds: 20
            failureThreshold: 6
{{- end }}