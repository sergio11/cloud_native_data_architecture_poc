# Self-contained Grafana (no upstream subchart; offline env).
# The dashboard JSON comes from the chart asset dashboards/platform-overview.json
# via .Files.Get (raw, no templating; single-brace JSON is Helm-safe).
{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "s8-ops.fullname" . }}-grafana
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "s8-ops.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: platform
        folder: Platform
        type: file
        options:
          path: /var/lib/grafana/dashboards
  platform-overview.json: |
    {{- .Files.Get "dashboards/platform-overview.json" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "s8-ops.fullname" . }}-grafana
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "s8-ops.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: {{ .Values.grafana.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "s8-ops.name" . }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "s8-ops.name" . }}
        app.kubernetes.io/component: grafana
    spec:
      containers:
        - name: grafana
          image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
          imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: {{ .Values.grafana.admin.user | quote }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: {{ .Values.grafana.admin.password | quote }}
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
          ports:
            - containerPort: 3000
              name: web
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: provisioning
              mountPath: /var/lib/grafana/dashboards/platform-overview.json
              subPath: platform-overview.json
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
      volumes:
        - name: provisioning
          configMap:
            name: {{ include "s8-ops.fullname" . }}-grafana
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "s8-ops.fullname" . }}-grafana
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "s8-ops.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  type: {{ .Values.grafana.service.type }}
  ports:
    - port: {{ .Values.grafana.service.port }}
      targetPort: 3000
      nodePort: {{ .Values.grafana.service.nodePort }}
      name: web
  selector:
    app.kubernetes.io/name: {{ include "s8-ops.name" . }}
    app.kubernetes.io/component: grafana
{{- end }}
