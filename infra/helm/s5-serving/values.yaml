# Serving layer: Trino over the Iceberg catalog.

global:
  namespace: platform

trino:
  enabled: true
  replicaCount: 1
  image:
    repository: trinodb/trino
    # First Trino release with iceberg.rest-catalog.oauth2.scope, required by Polaris.
    tag: "455"
    pullPolicy: IfNotPresent

  service:
    type: NodePort
    port: 8080
    # Must match the 8080 port kind forwards to the host.
    nodePort: 8080

  resources:
    requests:
      cpu: 400m
      memory: 896Mi
    limits:
      cpu: 1500m
      memory: 1280Mi

  jvm:
    # Below the container limit: the JVM also needs metaspace and direct memory.
    maxHeapSize: "896M"
    gc: "-XX:+UseG1GC"

  # Tied to jvm.maxHeapSize: Trino refuses when maxMemoryPerNode plus 30% headroom exceeds it.
  query:
    maxMemory: "800MB"
    maxMemoryPerNode: "400MB"

  # Empty schedules anywhere (multi-node: node-role.kubernetes.io/compute).
  nodeSelector: {}

  tolerations: []
  affinity: {}

catalogs:
  iceberg:
    enabled: true
    restCatalogUri: "http://polaris.platform.svc.cluster.local:8181/api/catalog"
    # REST clients identify the catalog by name; must match polaris.config.defaultCatalog.
    restCatalogName: "polaris"
    # Polaris 1.x expects PRINCIPAL_ROLE:ALL and rejects the default scope.
    oauth2Scope: "PRINCIPAL_ROLE:ALL"
    s3Endpoint: "http://minio.platform.svc.cluster.local:9000"
    # Required by the Trino native S3 client even for MinIO.
    s3Region: "us-east-1"
    s3AccessKey: "minioadmin"
    s3SecretKey: "minioadmin"
    s3PathStyleAccess: true
    # client_id:client_secret; must match polaris.clientId/clientSecret in s2-lakehouse.
    oauth2Credential: "poc-admin:poc-admin-secret"

  kafka:
    enabled: true
    nodes: "kafka.platform.svc.cluster.local:9092"
    tableNames: "sales.orders.events,marketing.clickstream.raw"

viewsInit:
  enabled: true
  image:
    repository: trinodb/trino
    # First Trino release with iceberg.rest-catalog.oauth2.scope, required by Polaris.
    tag: "455"
    pullPolicy: IfNotPresent
