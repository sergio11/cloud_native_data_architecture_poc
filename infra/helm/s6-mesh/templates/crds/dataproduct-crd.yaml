{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dataproducts.dataplatform.io
  labels:
    {{- include "s6-mesh.labels" . | nindent 4 }}
spec:
  group: dataplatform.io
  names:
    kind: DataProduct
    listKind: DataProductList
    plural: dataproducts
    singular: dataproduct
    shortNames:
      - dp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - description
                - classification
              properties:
                description:
                  type: string
                classification:
                  type: string
                  enum: ["public", "internal", "confidential", "restricted"]
                sla:
                  type: object
                  properties:
                    freshness:
                      type: string
                    availability:
                      type: string
                    latency_p99:
                      type: string
                assets:
                  type: array
                  items:
                    type: object
                quality:
                  type: object
                contract:
                  type: string
                schema:
                  type: string
                lineage:
                  type: object
{{- end }}
