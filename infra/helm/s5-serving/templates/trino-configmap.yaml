{{- if .Values.trino.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-config
  namespace: {{ .Values.global.namespace | default "platform" }}
  labels:
    app: trino
    {{- include "s5-serving.labels" . | nindent 4 }}
data:
  node.properties: |
    node.environment=poc
    node.data-dir=/data/trino

  jvm.config: |
    -server
    -Xmx{{ .Values.trino.jvm.maxHeapSize }}
    {{ .Values.trino.jvm.gc }}
    -XX:G1HeapRegionSize=32M
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+ExitOnOutOfMemoryError
    -Djdk.attach.allowAttachSelf=true

  config.properties: |
    coordinator=true
    node-scheduler.include-coordinator=true
    http-server.http.port=8080
    query.max-memory=800MB
    query.max-memory-per-node=400MB
    discovery.uri=http://localhost:8080

  iceberg.properties: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri={{ .Values.catalogs.iceberg.restCatalogUri }}
    # Polaris resolves a REST client to a catalog by NAME, not by S3 location:
    # the call is GET /api/catalog/v1/config?warehouse=<this value>. Giving the
    # S3 warehouse here makes every query fail with "Unable to find warehouse".
    iceberg.rest-catalog.warehouse={{ .Values.catalogs.iceberg.restCatalogName }}
    # OAuth2 required by Polaris 1.x — without a bearer token every catalog
    # call returns 401 and Trino cannot discover or query any table.
    iceberg.rest-catalog.security=OAUTH2
    iceberg.rest-catalog.oauth2.credential={{ .Values.catalogs.iceberg.oauth2Credential }}
    # Disable vended credentials: we supply our own MinIO key/secret below
    # and Polaris is not configured to vend STS tokens (no-sts mode).
    iceberg.rest-catalog.vended-credentials-enabled=false
    fs.native-s3.enabled=true
    s3.endpoint={{ .Values.catalogs.iceberg.s3Endpoint }}
    # s3.region is required by the Trino native S3 client even for MinIO.
    # Without it the client refuses to sign requests.
    s3.region={{ .Values.catalogs.iceberg.s3Region }}
    s3.aws-access-key={{ .Values.catalogs.iceberg.s3AccessKey }}
    s3.aws-secret-key={{ .Values.catalogs.iceberg.s3SecretKey }}
    s3.path-style-access={{ .Values.catalogs.iceberg.s3PathStyleAccess }}

  kafka.properties: |
    connector.name=kafka
    kafka.nodes={{ .Values.catalogs.kafka.nodes }}
    kafka.table-names={{ .Values.catalogs.kafka.tableNames }}
    kafka.hide-internal-columns=false
{{- end }}
