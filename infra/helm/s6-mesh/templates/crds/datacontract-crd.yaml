{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: datacontracts.dataplatform.io
  labels:
    {{- include "s6-mesh.labels" . | nindent 4 }}
spec:
  group: dataplatform.io
  names:
    kind: DataContract
    listKind: DataContractList
    plural: datacontracts
    singular: datacontract
    shortNames:
      - dc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            metadata:
              type: object
              properties:
                name:
                  type: string
                domain:
                  type: string
                product:
                  type: string
                version:
                  type: string
                owner:
                  type: string
            spec:
              type: object
              required:
                - description
                - schema
              properties:
                description:
                  type: string
                schema:
                  type: object
                  properties:
                    format:
                      type: string
                    ref:
                      type: string
                    fields:
                      type: array
                      items:
                        type: object
                quality:
                  type: object
                sla:
                  type: object
{{- end }}
