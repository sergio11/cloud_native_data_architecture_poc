{{- if .Values.kafka.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-creator
  namespace: {{ .Values.global.namespace | default "platform" }}
  labels:
    app: kafka-topic-creator
    {{- include "s4-stream.labels" . | nindent 4 }}
  annotations:
    # Run as a hook so `helm upgrade` replaces the Job instead of patching it:
    # Job spec.template is immutable and a server-side apply of a changed
    # template fails (see s4 upgrade failure). before-hook-creation deletes
    # the previous hook Job before the new one is created.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: kafka-topic-creator
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Kafka broker on port 9092 (timeout 300s)..."
              DEADLINE=$(($(date +%s) + 300))
              until nc -z -w 2 kafka.{{ .Values.global.namespace | default "platform" }}.svc.cluster.local 9092; do
                if [ "$(date +%s)" -ge "${DEADLINE}" ]; then
                  echo "ERROR: Kafka did not become reachable within 300 seconds."
                  exit 1
                fi
                sleep 2
              done
              echo "Kafka is reachable."
      containers:
        - name: topic-init
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          imagePullPolicy: {{ .Values.kafka.image.pullPolicy }}
          command:
            - /bin/sh
            - -ce
            - |
              echo "Initializing Kafka Topics..."
              {{- range .Values.topics }}
              /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server kafka.{{ $.Values.global.namespace | default "platform" }}.svc.cluster.local:9092 \
                --create --if-not-exists \
                --topic {{ .name }} \
                --partitions {{ .partitions }} \
                --replication-factor {{ .replicationFactor }}
              {{- end }}
              echo "Listing created topics:"
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka.{{ .Values.global.namespace | default "platform" }}.svc.cluster.local:9092 --list
              echo "Topics successfully provisioned."
{{- end }}
