{{- if .Values.trino.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: trino
  namespace: {{ .Values.global.namespace | default "platform" }}
  labels:
    app: trino
    {{- include "s5-serving.labels" . | nindent 4 }}
spec:
  type: {{ .Values.trino.service.type }}
  ports:
    - name: http
      port: {{ .Values.trino.service.port }}
      targetPort: 8080
      {{- if eq .Values.trino.service.type "NodePort" }}
      # Only valid on a NodePort Service; the API server rejects it otherwise.
      nodePort: {{ .Values.trino.service.nodePort }}
      {{- end }}
      protocol: TCP
  selector:
    app: trino
{{- end }}
