# Speed-layer probe Job (rake stream:probe)
#
# One pod with a local Flink cluster (no Kafka, JobManager, TaskManager or
# Operator) that runs the real operators so failures are reported directly.
apiVersion: batch/v1
kind: Job
metadata:
  name: flink-window-probe
  namespace: platform
  labels:
    app: flink-window-probe
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: flink-window-probe
    spec:
      restartPolicy: Never
      # Pinned where the image was loaded, to avoid confusing a pull failure with a probe failure.
      nodeSelector:
        kubernetes.io/hostname: poc-data-platform-worker
      volumes:
        - name: script
          configMap:
            name: flink-window-probe
      containers:
        - name: probe
          image: docker.io/poc/flink-stream:0.1.0
          # Never: images are loaded into the kind nodes by `rake cluster:image:load`.
          imagePullPolicy: Never
          env:
            - name: PYTHONPATH
              value: /opt/flink/opt/python:/opt/flink/opt/python/py4j-0.10.9.7-src.zip
            - name: POC_REPO_ROOT
              value: /opt/flink
            - name: ICEBERG_CATALOG_NAME
              value: polaris
            - name: ICEBERG_CATALOG_URI
              value: http://polaris.platform.svc.cluster.local:8181/api/catalog
            # The catalog identifier, not the S3 location: Polaris resolves it by name.
            - name: ICEBERG_WAREHOUSE
              value: polaris
            - name: S3_ENDPOINT
              value: http://minio.platform.svc.cluster.local:9000
            - name: S3_ACCESS_KEY
              value: minioadmin
            - name: S3_SECRET_KEY
              value: minioadmin
            - name: POLARIS_OAUTH2_CREDENTIAL
              value: poc-admin:poc-admin-secret
            # Iceberg writes data files with S3FileIO (AWS SDK v2), which reads these
            # instead of the catalog's s3.access-key / s3.secret-key.
            - name: AWS_ACCESS_KEY_ID
              value: minioadmin
            - name: AWS_SECRET_ACCESS_KEY
              value: minioadmin
            - name: AWS_REGION
              value: us-east-1
          volumeMounts:
            - name: script
              mountPath: /probe
              readOnly: true
          command:
            - /bin/bash
            - -c
            - |
              set -o pipefail
              cd /opt/flink
              # The checkpoint check needs hadoop-aws' s3a, which asks for unshaded
              # Guava (Flink relocates its own); the image carries it, and this
              # fetches it if missing.
              if ! ls /opt/flink/lib/guava-*.jar >/dev/null 2>&1; then
                echo "Guava ausente en la imagen; se descarga para la prueba"
                curl -fsSL -o /opt/flink/lib/guava-28.2-jre.jar \
                  https://repo1.maven.org/maven2/com/google/guava/guava/28.2-jre/guava-28.2-jre.jar \
                  && ls -lh /opt/flink/lib/guava-*.jar \
                  || echo "AVISO: no se pudo obtener Guava; s3a:// no sera comprobable"
              fi
              /opt/py310/bin/python /probe/window_write_probe.py 2>&1 | tee /tmp/probe.log
              echo "PROBE_EXIT=${PIPESTATUS[0]}"