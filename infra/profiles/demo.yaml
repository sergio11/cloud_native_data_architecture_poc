# Full topology: every subsystem. `subsystems.<chart>` is a verbatim Helm values
# fragment for infra/helm/<chart>. The runnable end-to-end demo is the sequence
# of phases (`rake demo:phases`), which keeps Spark and Flink from running together.
profile:
  name: "demo"
  description: "Full architecture demo - all subsystems, heavy engines run sequentially"
  targetRamMb: 8000
  targetCpuCores: 6.0

subsystems:
  s1-ingestion:
    postgresql:
      enabled: true
      resources:
        requests:
          cpu: "100m"
          memory: "192Mi"
        limits:
          cpu: "400m"
          memory: "384Mi"
    ingestionRunner:
      enabled: true
      resources:
        requests:
          cpu: "50m"
          memory: "96Mi"
        limits:
          cpu: "250m"
          memory: "192Mi"

  s2-lakehouse:
    minio:
      enabled: true
      resources:
        requests:
          cpu: "100m"
          memory: "192Mi"
        limits:
          cpu: "400m"
          memory: "384Mi"
    polaris:
      enabled: true
      # Below ~1Gi the Quarkus JVM spends its time in GC and never becomes ready.
      resources:
        requests:
          cpu: "150m"
          memory: "384Mi"
        limits:
          cpu: "600m"
          memory: "1024Mi"

  s3-batch:
    sparkOperator:
      enabled: true
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "250m"
          memory: "256Mi"
    sparkDefaults:
      driver:
        cores: 1
        coreLimit: "500m"
        memory: "512m"
        memoryOverhead: "384m"
      executor:
        cores: 1
        coreLimit: "500m"
        instances: 1
        memory: "512m"
        memoryOverhead: "384m"

  s4-stream:
    kafka:
      enabled: true
      resources:
        requests:
          cpu: "200m"
          memory: "384Mi"
        limits:
          cpu: "600m"
          memory: "768Mi"
    kafkaUi:
      enabled: true
      resources:
        requests:
          cpu: "50m"
          memory: "96Mi"
        limits:
          cpu: "150m"
          memory: "192Mi"
    flinkOperator:
      enabled: true
      replicaCount: 1
      # Quarkus JVM: needs ~512Mi and CPU headroom for its health endpoint.
      resources:
        requests:
          cpu: "200m"
          memory: "256Mi"
        limits:
          cpu: "800m"
          memory: "512Mi"
    flinkJobs:
      ordersStream:
        enabled: true
        jobManager:
          # Floor imposed by the Flink operator (see values.yaml).
          memory: "768m"
          cpu: 0.4
        taskManager:
          memory: "1024m"
          cpu: 0.4
          replicas: 1
      clickstreamStream:
        enabled: false

  s5-serving:
    trino:
      enabled: true
      # Heap must leave room for metaspace and direct buffers inside the limit.
      resources:
        requests:
          cpu: "400m"
          memory: "896Mi"
        limits:
          cpu: "1200m"
          memory: "1280Mi"
      jvm:
        maxHeapSize: "896M"

  s6-mesh:
    kyverno:
      enabled: true
      policiesEnabled: true
      resources:
        requests:
          cpu: "50m"
          memory: "96Mi"
        limits:
          cpu: "200m"
          memory: "192Mi"

  s7-fabric:
    marquez:
      enabled: true
      resources:
        requests:
          cpu: "100m"
          memory: "192Mi"
        limits:
          cpu: "350m"
          memory: "320Mi"

  s8-ops:
    prometheus:
      enabled: true
      resources:
        requests:
          cpu: "100m"
          memory: "160Mi"
        limits:
          cpu: "300m"
          memory: "256Mi"
    grafana:
      enabled: true
      resources:
        requests:
          cpu: "50m"
          memory: "96Mi"
        limits:
          cpu: "200m"
          memory: "192Mi"
