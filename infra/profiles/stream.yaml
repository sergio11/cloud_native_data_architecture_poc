# ==============================================================================
# Modern Data Architecture POC - Startup Profile: Stream
# File: infra/profiles/stream.yaml
# CONTRACT (K-B): each `subsystems.<chart>` is a verbatim Helm values fragment
# for infra/helm/<chart> (keys verified 1:1 against each chart's values.yaml).
# Only charts this profile deploys have a section (s1, s2, s4, s5).
# NOTE: s8 is NOT deployed by the stream path of profile-up.sh (observability
# for streaming stays on the demo profile until a profile explicitly wires it).
# Target RAM Footprint: ~6.0 GB RAM
# ==============================================================================
profile:
  name: "stream"
  description: "Real-time stream processing with Kafka, Apache Flink, and Observability"
  targetRamMb: 6144
  targetCpuCores: 4.0

subsystems:
  s1-ingestion:
    postgresql:
      enabled: true
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "384Mi"
    ingestionRunner:
      enabled: false

  s2-lakehouse:
    minio:
      enabled: true
      resources:
        requests:
          cpu: "150m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "384Mi"
    polaris:
      enabled: true
      resources:
        requests:
          cpu: "150m"
          memory: "384Mi"
        limits:
          cpu: "600m"
          memory: "512Mi"

  s4-stream:
    kafka:
      enabled: true
      resources:
        requests:
          cpu: "300m"
          memory: "512Mi"
        limits:
          cpu: "1000m"
          memory: "768Mi"
    kafkaUi:
      enabled: true
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "200m"
          memory: "256Mi"
    flinkOperator:
      enabled: true
      replicaCount: 1
      resources:
        requests:
          cpu: "150m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "384Mi"
    flinkJobs:
      ordersStream:
        enabled: true
        jobManager:
          memory: "384m"
          cpu: 0.5
        taskManager:
          memory: "512m"
          cpu: 0.5
          replicas: 1
      clickstreamStream:
        enabled: true
        jobManager:
          memory: "384m"
          cpu: 0.5
        taskManager:
          memory: "512m"
          cpu: 0.5
          replicas: 1

  s5-serving:
    trino:
      enabled: false
