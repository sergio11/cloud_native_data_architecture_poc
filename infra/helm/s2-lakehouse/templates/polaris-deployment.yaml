{{- if .Values.polaris.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polaris
  namespace: {{ .Values.global.namespace | default "platform" }}
  labels:
    app: polaris
    {{- include "s2-lakehouse.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.polaris.replicaCount }}
  selector:
    matchLabels:
      app: polaris
  template:
    metadata:
      labels:
        app: polaris
        {{- include "s2-lakehouse.labels" . | nindent 8 }}
    spec:
      {{- with .Values.polaris.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-minio
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for MinIO on port 9000..."
              until nc -z -w 2 minio.{{ .Values.global.namespace | default "platform" }}.svc.cluster.local 9000; do
                sleep 2
              done
              echo "MinIO reachable."
      containers:
        - name: polaris
          image: "{{ .Values.polaris.image.repository }}:{{ .Values.polaris.image.tag }}"
          imagePullPolicy: {{ .Values.polaris.image.pullPolicy }}
          ports:
            - name: rest-api
              containerPort: 8181
              protocol: TCP
            # Quarkus management interface for /q/health; the catalog API needs auth.
            - name: management
              containerPort: 8182
              protocol: TCP
          env:
            # Metastore type. Quarkus maps a dot to one underscore; a double
            # underscore escapes a literal underscore.
            - name: POLARIS_PERSISTENCE_TYPE
              value: {{ .Values.polaris.persistence.type | quote }}
            {{- if ne .Values.polaris.persistence.type "in-memory" }}
            # Dots map to single underscores; a doubled underscore is silently ignored.
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: {{ .Values.polaris.persistence.jdbcUrl | quote }}
            - name: QUARKUS_DATASOURCE_USERNAME
              value: {{ .Values.polaris.persistence.username | quote }}
            - name: QUARKUS_DATASOURCE_PASSWORD
              value: {{ .Values.polaris.persistence.password | quote }}
            - name: QUARKUS_DATASOURCE_JDBC_DRIVER
              value: {{ .Values.polaris.persistence.driver | quote }}
            - name: POLARIS_PERSISTENCE_JDBC_CONNECTION_URL
              value: {{ .Values.polaris.persistence.jdbcUrl | quote }}
            - name: POLARIS_PERSISTENCE_JDBC_CONNECTION_DRIVER
              value: {{ .Values.polaris.persistence.driver | quote }}
            - name: POLARIS_PERSISTENCE_JDBC_CONNECTION_USER
              value: {{ .Values.polaris.persistence.username | quote }}
            - name: POLARIS_PERSISTENCE_JDBC_CONNECTION_PASSWORD
              value: {{ .Values.polaris.persistence.password | quote }}
            - name: POLARIS_PERSISTENCE_JDBC_CONNECTION_POOL_MAX_SIZE
              value: {{ .Values.polaris.persistence.poolMaxSize | quote }}
            # Polaris 1.8 maps tables with Hibernate, so its DDL export must be enabled.
            - name: POLARIS_PERSISTENCE_JDBC_SCHEMA_MANAGEMENT_TYPE
              value: "hibernate"
            - name: QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION
              value: "update"
            {{- end }}
            # Fixed root credentials, or Polaris generates a random pair every boot.
            # Format is "realm,clientId,clientSecret", ";" between realms.
            - name: POLARIS_BOOTSTRAP_CREDENTIALS
              value: "{{ .Values.polaris.realm }},{{ .Values.polaris.clientId }},{{ .Values.polaris.clientSecret }}"
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.polaris.config.accessKey | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              value: {{ .Values.polaris.config.secretKey | quote }}
            - name: AWS_REGION
              value: {{ .Values.polaris.config.awsRegion | quote }}
          resources:
            {{- toYaml .Values.polaris.resources | nindent 12 }}
          # Slow boot, so a startupProbe holds liveness and readiness back: 5s x 120.
          startupProbe:
            httpGet:
              path: /q/health/ready
              port: 8182
            # 1s (the default) is shorter than a GC pause in a loaded Quarkus JVM.
            timeoutSeconds: 10
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8182
            timeoutSeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8182
            timeoutSeconds: 10
            periodSeconds: 20
            failureThreshold: 6
{{- end }}