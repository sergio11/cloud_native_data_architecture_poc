apiVersion: dataplatform.io/v1alpha1
kind: DataProduct
metadata:
  name: leads
  domain: marketing
  owner: marketing-analytics@company.internal
  version: "1.1.0"
  created_at: "2024-01-15"
  updated_at: "2024-09-26"
spec:
  description: "Digital web clickstream events, user navigation sessions, and lead funnel metrics with GDPR pseudonymization."
  classification: internal
  sla:
    freshness: "15m"
    availability: "99.5%"
    latency_p99: "1s"
  assets:
    - name: stream_funnel_metrics
      type: iceberg_table
      path: "s3://datalake/warehouse/stream/marketing/funnel_metrics"
      format: parquet
      partitioned_by: ["event_type", "event_date"]
      description: "Real-time funnel conversion metrics computed by Apache Flink"
      access_tier: internal
      status: planned
    - name: silver_leads
      type: iceberg_table
      path: "s3://datalake/warehouse/silver/marketing/leads"
      format: parquet
      description: "Validated and pseudonymized clickstream navigation events"
      access_tier: internal
      status: planned
    - name: clickstream_events_stream
      type: kafka_topic
      path: "marketing.clickstream.raw"
      description: "Raw real-time digital clickstream log"
      access_tier: internal
  quality:
    completeness: 0.98
    uniqueness: 0.99
    timeliness: 0.99
    validity: 0.99
  contract: "./contract.yaml"
  schema: "./schema.json"
  consumers:
    - name: sales-growth
      contact: sales-leaders@company.internal
      use_case: "Cart abandonment intervention"
  tags:
    - marketing
    - clickstream
    - funnel
    - streaming
