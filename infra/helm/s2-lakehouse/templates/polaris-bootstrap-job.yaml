{{- if .Values.polaris.enabled }}
# =============================================================================
# polaris-bootstrap-job.yaml
#
# Idempotent Polaris catalog bootstrap. Runs after every Polaris restart.
#
# Problem: Polaris 1.8 with the in-memory metastore loses all catalog state on
# restart. The Iceberg table *files* survive in MinIO but the catalog entries
# (namespace "sales" + table "orders_windowed") disappear, making every engine
# blind to them. This Job re-creates the catalog after each boot.
#
# Design:
#   1. Wait for Polaris management port /q/health/ready (same target as the
#      startupProbe — guarantees the server accepted its credentials).
#   2. Obtain an OAuth2 token from the Polaris token endpoint using the fixed
#      root credentials from values.yaml (realm POLARIS, client_id poc-admin).
#   3. Create the catalog "polaris" pointing at MinIO if it does not already
#      exist (idempotent: HTTP 409 Conflict is treated as success).
#   4. Create the "sales" and "marketing" namespaces inside the catalog
#      (idempotent: 409 is treated as success).
#
# The Job runs with restartPolicy: OnFailure and backoffLimit: 20 so that
# transient Polaris boot delays do not leave the catalog unpopulated.
#
# Credentials are read from values.yaml (polaris.realm / clientId / clientSecret)
# and must match POLARIS_BOOTSTRAP_CREDENTIALS set in polaris-deployment.yaml.
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: polaris-catalog-bootstrap
  namespace: {{ .Values.global.namespace | default "platform" }}
  labels:
    app: polaris-catalog-bootstrap
    {{- include "s2-lakehouse.labels" . | nindent 4 }}
  annotations:
    # A real hook, not just a weight: hook-weight alone does nothing without
    # helm.sh/hook, and without the hook the Job is an ordinary resource that
    # Helm patches - and spec.template is immutable, so the second upgrade failed
    # with "field is immutable" every time this script changed.
    #
    # before-hook-creation + hook-succeeded means every upgrade runs a fresh Job
    # (it is deleted as soon as it succeeds, so it never lingers either).
    #
    # post-install, NOT pre-install: the initContainer waits for
    # polaris.platform.svc.cluster.local:8182, and on a first install that
    # Service and its Deployment are ordinary (non-hook) resources that Helm has
    # not created yet. As a pre-install hook the Job waited forever and the whole
    # `helm install s2-lakehouse` hung until its timeout, taking the platform
    # profile with it. post-install guarantees the Polaris pod exists first;
    # pre-upgrade keeps reconciling the catalog before an upgrade rolls the pod.
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  # Keep completed pods for 10 minutes so logs are readable after success.
  ttlSecondsAfterFinished: 600
  backoffLimit: 20
  # backoffLimit alone cannot rescue a hang: the initContainer below sleeps in a
  # loop and never exits, so the pod stays Running and backoffLimit never
  # engages. This is the hard ceiling that turns "waiting forever" into a
  # failure Helm reports instead of an install that never finishes.
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: polaris-catalog-bootstrap
    spec:
      restartPolicy: OnFailure
      initContainers:
        # Step 1: wait until Polaris is genuinely healthy (not just port-open).
        # Uses the management port 8182 which serves /q/health/ready without
        # authentication (same endpoint as the startupProbe).
        - name: wait-for-polaris
          image: curlimages/curl:8.9.1
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Polaris management port /q/health/ready..."
              ATTEMPT=0
              until curl -sf http://polaris.{{ .Values.global.namespace | default "platform" }}.svc.cluster.local:8182/q/health/ready; do
                ATTEMPT=$((ATTEMPT + 1))
                # 120 attempts x 5s = 10 min. Same ceiling as
                # activeDeadlineSeconds, so the reason for the failure is printed
                # in the log rather than only "DeadlineExceeded" from kubelet.
                if [ "${ATTEMPT}" -ge 120 ]; then
                  echo "ERROR: Polaris still not ready after ${ATTEMPT} attempts (~10 min)."
                  echo "       Check: kubectl logs -n {{ .Values.global.namespace | default "platform" }} deploy/polaris"
                  exit 1
                fi
                echo "Polaris not ready yet (attempt ${ATTEMPT}), retrying in 5s..."
                sleep 5
              done
              echo "Polaris is ready."
      containers:
        - name: catalog-init
          image: curlimages/curl:8.9.1
          env:
            - name: POLARIS_BASE_URL
              value: "http://polaris.{{ .Values.global.namespace | default "platform" }}.svc.cluster.local:8181"
            - name: POLARIS_REALM
              value: {{ .Values.polaris.realm | quote }}
            - name: POLARIS_CLIENT_ID
              value: {{ .Values.polaris.clientId | quote }}
            - name: POLARIS_CLIENT_SECRET
              value: {{ .Values.polaris.clientSecret | quote }}
            - name: CATALOG_NAME
              value: {{ .Values.polaris.config.defaultCatalog | quote }}
            - name: WAREHOUSE_LOCATION
              value: {{ .Values.polaris.config.warehouseLocation | quote }}
            # URL-encoded form of WAREHOUSE_LOCATION, for the ?warehouse= query
            # parameter of the Iceberg REST config endpoint (s3://warehouse/ ->
            # s3%3A%2F%2Fwarehouse%2F). POSIX sh has no URL encoder, so the two
            # characters that actually need escaping are replaced here and the
            # rest of the value is expected to be safe.
            - name: WAREHOUSE_ENCODED
              value: {{ .Values.polaris.config.warehouseLocation | replace "/" "%2F" | replace ":" "%3A" | quote }}
            - name: S3_ENDPOINT
              value: {{ .Values.polaris.config.s3Endpoint | quote }}
            - name: AWS_REGION
              value: {{ .Values.polaris.config.awsRegion | quote }}
          command:
            - /bin/sh
            - -ce
            - |
              echo "=== Polaris Catalog Bootstrap ==="
              echo "Realm: ${POLARIS_REALM}  Catalog: ${CATALOG_NAME}"

              # -----------------------------------------------------------------
              # Step 2: obtain an OAuth2 bearer token
              # Endpoint: /api/catalog/v1/oauth/tokens
              # Polaris 1.8 management API requires a token even for admin calls.
              # -----------------------------------------------------------------
              TOKEN=$(curl -sf \
                -X POST "${POLARIS_BASE_URL}/api/catalog/v1/oauth/tokens" \
                -H "Content-Type: application/x-www-form-urlencoded" \
                -d "grant_type=client_credentials&client_id=${POLARIS_CLIENT_ID}&client_secret=${POLARIS_CLIENT_SECRET}&scope=PRINCIPAL_ROLE:ALL" \
                | grep -o '"access_token":"[^"]*"' \
                | sed 's/"access_token":"//;s/"$//')

              if [ -z "${TOKEN}" ]; then
                echo "ERROR: failed to obtain OAuth2 token from Polaris."
                exit 1
              fi
              echo "Token obtained."

              AUTH="Authorization: Bearer ${TOKEN}"

              # -----------------------------------------------------------------
              # Step 3: recreate the catalog.
              #
              # Delete first, on purpose. Treating 409 as success is what made
              # this silently rot: a catalog created days ago with a different
              # default-base-location was never corrected, so Polaris answered
              # POST /catalogs with 409 (it exists) while the Iceberg REST
              # lookup answered 404 "Unable to find warehouse <the one in
              # values>" - because it resolves catalogs BY base location and the
              # old one no longer matched. Recreating makes the catalog always
              # match these values. Polaris keeps the catalog in memory, so this
              # is also how a restarted Polaris gets its catalog back.
              # Management API endpoint: /api/management/v1/catalogs
              # -----------------------------------------------------------------
              echo "Dropping catalog '${CATALOG_NAME}' if present (keeps it in sync with these values)..."
              # Printed first: when the catalog refuses to drop ("it is not
              # empty") this line is the only way to see the base location it
              # actually carries, which is what the Iceberg REST clients resolve.
              echo "Existing catalog definition:"
              curl -s "${POLARIS_BASE_URL}/api/management/v1/catalogs/${CATALOG_NAME}" -H "${AUTH}" || true
              echo ""
              {{- if ne .Values.polaris.persistence.type "in-memory" }}
              # NOT dropped with a persistent metastore. The catalog now survives
              # a Polaris restart on its own, and dropping it would throw away the
              # Iceberg table metadata on every deploy. 409 from the create below
              # is then the correct, expected answer.
              echo "Metastore is persistent: keeping the existing catalog as-is."
              {{- else }}
              DROP=$(curl -s -o /dev/null -w "%{http_code}" \
                -X DELETE "${POLARIS_BASE_URL}/api/management/v1/catalogs/${CATALOG_NAME}?cascade=true&purge=true" \
                -H "${AUTH}")
              if [ "${DROP}" = "204" ] || [ "${DROP}" = "200" ]; then
                echo "Existing catalog dropped (HTTP ${DROP})."
              elif [ "${DROP}" = "404" ]; then
                echo "No catalog to drop (HTTP 404), creating it."
              else
                # Non-fatal: a catalog Polaris refuses to drop is still usable if
                # its base location already matches. The verification below is
                # what decides whether the run is a success.
                echo "WARN: dropping the catalog returned HTTP ${DROP}; continuing."
              fi
              {{- end }}

              echo "Creating catalog '${CATALOG_NAME}'..."
              STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
                -X POST "${POLARIS_BASE_URL}/api/management/v1/catalogs" \
                -H "${AUTH}" \
                -H "Content-Type: application/json" \
                -d "{
                  \"name\": \"${CATALOG_NAME}\",
                  \"type\": \"INTERNAL\",
                  \"properties\": {
                    \"default-base-location\": \"${WAREHOUSE_LOCATION}\"
                  },
                  \"storageConfigInfo\": {
                    \"storageType\": \"S3\",
                    \"allowedLocations\": [\"${WAREHOUSE_LOCATION}\"],
                    \"endpoint\": \"${S3_ENDPOINT}\",
                    \"region\": \"${AWS_REGION}\",
                    \"pathStyleAccess\": true,
                    \"s3.endpoint\": \"${S3_ENDPOINT}\",
                    \"s3.region\": \"${AWS_REGION}\",
                    \"s3.path-style-access\": \"true\"
                  }
                }")

              if [ "${STATUS}" = "201" ] || [ "${STATUS}" = "409" ]; then
                echo "Catalog '${CATALOG_NAME}' ready (HTTP ${STATUS})."
              else
                echo "ERROR: catalog creation returned HTTP ${STATUS}."
                exit 1
              fi

              # -----------------------------------------------------------------
              # Step 3a: grant the job principal a role ON the catalog.
              #
              # Creating a catalog does not grant anything on it. Polaris resolves
              # an Iceberg REST client to a catalog per principal, so a client
              # whose service account holds no role sees nothing and GET
              # /v1/config?warehouse=... answers 404 "Unable to find warehouse" -
              # even though the catalog exists with exactly that base location
              # and the very same token works on the catalog API (a different
              # code path). Granting catalog_admin is what makes it visible.
              # Management API: /api/management/v1/catalogs/{catalog}/catalog-roles
              # -----------------------------------------------------------------
              echo "Granting catalog_admin on '${CATALOG_NAME}' to service role '${POLARIS_CLIENT_ID}'..."
              GRANT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                -X POST "${POLARIS_BASE_URL}/api/management/v1/catalogs/${CATALOG_NAME}/catalog-roles" \
                -H "${AUTH}" \
                -H "Content-Type: application/json" \
                -d "{
                  \"catalogRole\": { \"name\": \"catalog_admin\" },
                  \"principal\": { \"type\": \"SERVICE_ROLE\", \"name\": \"${POLARIS_CLIENT_ID}\" }
                }")
              if [ "${GRANT_STATUS}" = "201" ] || [ "${GRANT_STATUS}" = "204" ]; then
                echo "Role granted (HTTP ${GRANT_STATUS})."
              elif [ "${GRANT_STATUS}" = "409" ]; then
                echo "Role already present (HTTP 409)."
              else
                echo "ERROR: granting catalog_admin returned HTTP ${GRANT_STATUS}."
                exit 1
              fi

              # -----------------------------------------------------------------
              # Step 4: create namespaces inside the catalog (idempotent)
              # Catalog API endpoint: /api/catalog/v1/{catalog}/namespaces
              # -----------------------------------------------------------------
              for NS in sales marketing finance; do
                echo "Creating namespace '${NS}' in catalog '${CATALOG_NAME}'..."
                NS_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
                  -X POST "${POLARIS_BASE_URL}/api/catalog/v1/${CATALOG_NAME}/namespaces" \
                  -H "${AUTH}" \
                  -H "Content-Type: application/json" \
                  -d "{\"namespace\": [\"${NS}\"]}")

                if [ "${NS_STATUS}" = "200" ] || [ "${NS_STATUS}" = "409" ]; then
                  echo "Namespace '${NS}' ready (HTTP ${NS_STATUS})."
                else
                  echo "ERROR: namespace '${NS}' creation returned HTTP ${NS_STATUS}."
                  exit 1
                fi
              done

              # -----------------------------------------------------------------
              # Step 5: verify the catalog resolves the way clients will ask.
              #
              # Polaris identifies a catalog for an Iceberg REST client BY NAME:
              # the call is GET /api/catalog/v1/config?warehouse=<catalog name>,
              # NOT by the S3 base location. A bootstrap that treats the catalog
              # POST returning 409 as success used to look completely healthy while
              # every Flink/Trino job failed with "Unable to find warehouse
              # s3://warehouse/" - because it never checked the lookup at all.
              #
              # Runs after the namespaces on purpose: a failing assertion here must
              # not leave the catalog without them.
              # -----------------------------------------------------------------
              echo "Verifying Polaris resolves catalog '${CATALOG_NAME}' for REST clients..."
              CONFIG_STATUS=000
              ATTEMPT=1
              while [ "${ATTEMPT}" -le 3 ]; do
                CONFIG_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                  "${POLARIS_BASE_URL}/api/catalog/v1/config?warehouse=${CATALOG_NAME}" \
                  -H "${AUTH}")
                if [ "${CONFIG_STATUS}" = "200" ]; then
                  break
                fi
                echo "  attempt ${ATTEMPT}: HTTP ${CONFIG_STATUS}, waiting 10s..."
                sleep 10
                ATTEMPT=$((ATTEMPT + 1))
              done
              if [ "${CONFIG_STATUS}" = "200" ]; then
                echo "Catalog '${CATALOG_NAME}' resolves: REST clients reach the warehouse '${WAREHOUSE_LOCATION}'."
              else
                echo "ERROR: Polaris returned HTTP ${CONFIG_STATUS} for warehouse='${CATALOG_NAME}'."
                echo "       No Iceberg client can use this catalog."
                exit 1
              fi

              echo "=== Polaris catalog bootstrap complete ==="
{{- end }}
