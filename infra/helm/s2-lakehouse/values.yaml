# Lakehouse storage and catalog: MinIO and the Polaris Iceberg REST catalog.

global:
  namespace: platform
  storageClass: "standard"

# MinIO S3 Object Storage
minio:
  enabled: true
  replicaCount: 1
  image:
    # Upstream minio/minio is no longer published; this is the archived Bitnami
    # build.
    repository: bitnamilegacy/minio
    tag: "2025.7.23"
    pullPolicy: IfNotPresent

  auth:
    rootUser: "minioadmin"
    rootPassword: "minioadmin"

  service:
    type: NodePort
    # nodePort must equal the host-mapped port in infra/kind/cluster-config.yaml,
    # which widens service-node-port-range so these low ports are legal.
    apiPort: 9000
    apiNodePort: 9000
    consolePort: 9001
    consoleNodePort: 9001

  persistence:
    enabled: true
    storageClass: "standard"
    accessMode: ReadWriteOnce
    size: 10Gi

  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 384Mi

  # Empty schedules anywhere (multi-node: node-role.kubernetes.io/storage).
  nodeSelector: {}

  tolerations: []
  affinity: {}

# Buckets created at install time.
bucketInit:
  enabled: true
  image:
    # mc client for the bucket-init job; upstream minio/mc is gone.
    repository: bitnamilegacy/minio-client
    tag: "2025.7.21"
    pullPolicy: IfNotPresent
  buckets:
    - datalake
    - warehouse
    - bronze
    - silver
    - gold
    - stream
    - contracts
    - checkpoints

# Apache Polaris REST Iceberg catalog.
polaris:
  enabled: true
  replicaCount: 1
  image:
    repository: apache/polaris
    # Pinned: "latest" moved to 1.8.0, and 2.x breaks the 1.8 runtime config.
    tag: "1.8.0"
    pullPolicy: IfNotPresent

  service:
    type: NodePort
    port: 8181
    # Must match the 8181 port kind forwards to the host (see MinIO above).
    nodePort: 8181

  # Fixed root credentials, passed via POLARIS_BOOTSTRAP_CREDENTIALS; without
  # them Polaris generates a random pair on every boot. Every Iceberg REST client
  # must use the same values.
  realm: "POLARIS"
  clientId: "poc-admin"
  clientSecret: "poc-admin-secret"

  # durable catalog metadata. type is mapped to POLARIS_PERSISTENCE_TYPE; jdbc
  # is the durable option and the image only ships a PostgreSQL driver.
  persistence:
    # in-memory for now: with a JDBC metastore Polaris does not bootstrap the realm
    # on startup, so polaris-bootstrap-job.yaml recreates the catalog after every
    # restart.
    type: "in-memory"
    driver: "org.postgresql.Driver"
    # Reuses the Postgres from s1-ingestion. Plain literals: Helm does not
    # evaluate templates inside values.yaml.
    host: "postgres-oltp.platform.svc.cluster.local"
    database: "poc_oltp"
    username: "postgres"
    password: "oltp_password_secret"
    # currentSchema must be explicit, or the driver sees a foreign search_path.
    jdbcUrl: "jdbc:postgresql://postgres-oltp.platform.svc.cluster.local:5432/poc_oltp?currentSchema=public"
    # Polaris only issues a few metadata queries.
    poolMaxSize: 10

  config:
    defaultCatalog: "polaris"
    warehouseLocation: "s3://warehouse/"
    s3Endpoint: "http://minio.platform.svc.cluster.local:9000"
    awsRegion: "us-east-1"
    accessKey: "minioadmin"
    secretKey: "minioadmin"

  resources:
    requests:
      cpu: 200m
      # Quarkus sizes its heap from the limit; below ~1Gi it never becomes
      # ready.
      memory: 512Mi
    limits:
      cpu: 800m
      memory: 1024Mi

  # Empty schedules anywhere (multi-node: node-role.kubernetes.io/storage).
  nodeSelector: {}

  tolerations: []
  affinity: {}

# PVC shared by the medallion, streaming and serving jobs.
lakehouseStorage:
  enabled: true
  name: "lakehouse-storage"
  accessMode: "ReadWriteOnce"
  storageClass: "standard"
  size: "2Gi"

# Registers the Iceberg tables in the catalog: catalog_registration.py produces
# those entries and unified_view.sql needs them.
catalogRegistration:
  enabled: true
  # Built from this repository, so script and manifests share a revision.
  image:
    repository: docker.io/poc/ingest
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  # Optional: also registers the datasets in Marquez, which lives in s7-fabric.
  marquezUrl: ""
  # Manifests patched with the physical table paths.
  manifestsDir: "/app/domains"