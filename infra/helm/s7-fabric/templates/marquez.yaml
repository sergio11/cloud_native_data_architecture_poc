{{- if .Values.marquez.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marquez
  namespace: platform
  labels:
    app: marquez
    subsystem: s7-fabric
spec:
  replicas: {{ .Values.marquez.replicaCount }}
  selector:
    matchLabels:
      app: marquez
  template:
    metadata:
      labels:
        app: marquez
    spec:
      containers:
        - name: marquez
          image: "{{ .Values.marquez.image.repository }}:{{ .Values.marquez.image.tag }}"
          imagePullPolicy: {{ .Values.marquez.image.pullPolicy }}
          ports:
            - containerPort: 5000
              name: api
            - containerPort: 3000
              name: web
          env:
            - name: MARQUEZ_PORT
              value: "5000"
            - name: MARQUEZ_ADMIN_PORT
              value: "5001"
            # The catalogue lives in PostgreSQL and the image reads these
            # variables (the same ones the upstream chart's subchart
            # provides). Without them the server dies in the Flyway
            # migration with "UnknownHostException: postgres".
            - name: POSTGRES_HOST
              value: "marquez-postgresql"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "marquez"
            - name: POSTGRES_USER
              value: "marquez"
            - name: POSTGRES_PASSWORD
              value: "marquez"
            # The first migration of a fresh database otherwise fails.
            - name: FLYWAY_BASELINE_ON_MIGRATE
              value: "true"
            # The JVM sizes its heap from the container limit, and 512 Mi of
            # container does not leave room for the default 1/4-of-RAM heap
            # plus the metaspace: the pod was OOM-killed on boot.
            - name: JAVA_OPTS
              value: "-Xms128m -Xmx320m -XX:+UseG1GC"
          resources:
            {{- toYaml .Values.marquez.resources | nindent 12 }}
          # Marquez is a Dropwizard/Jetty JVM and was the only workload in the
          # repo with no probes at all. Two consequences, both bad:
          #   * nothing gated the Service endpoints, so a pod stuck in
          #     CrashLoopBackOff kept receiving traffic and the NodePort
          #     answered with connection resets instead of a 503;
          #   * with no startupProbe, a liveness probe would fire during boot
          #     and SIGTERM the JVM (exit 143) before it ever became healthy -
          #     the exact loop already documented in
          #     s4-stream/templates/flink-operator-deployment.yaml.
          # So: startupProbe buys 5 minutes of boot, then liveness, then
          # readiness takes the pod out of the endpoints.
          startupProbe:
            httpGet:
              path: /api/marquez/version
              port: 5000
            timeoutSeconds: 10
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/marquez/version
              port: 5000
            timeoutSeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/marquez/version
              port: 5000
            timeoutSeconds: 10
            periodSeconds: 20
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: marquez
  namespace: platform
  labels:
    app: marquez
spec:
  type: {{ .Values.marquez.service.type }}
  ports:
    - port: 5000
      targetPort: 5000
      name: api
    - port: {{ .Values.marquez.service.webPort }}
      targetPort: {{ .Values.marquez.service.webPort }}
      nodePort: {{ .Values.marquez.service.nodePortWeb }}
      name: web
  selector:
    app: marquez
{{- end }}
