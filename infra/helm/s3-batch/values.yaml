# ==============================================================================
# Subsystem S3: Batch Processing Layer - Values Configuration
# File: infra/helm/s3-batch/values.yaml
# ==============================================================================

global:
  namespace: platform
  computeNamespace: sales

sparkOperator:
  enabled: true
  replicaCount: 1
  image:
    # v1beta2-1.6.2-3.5.0 = latest v1beta2 CRD API compatible with Spark 3.5.x.
    repository: kubeflow/spark-operator
    tag: "v1beta2-1.6.2-3.5.0"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

  # Empty by default so single-node clusters schedule anywhere (multi-node:
  # nodeSelector: {node-role.kubernetes.io/compute: "true"}).
  nodeSelector: {}

  tolerations: []
  affinity: {}

sparkDefaults:
  image:
    # Built from repo root: docker build -f infra/docker/spark.Dockerfile -t poc/spark-medallion:0.1.0 .
    repository: poc/spark-medallion
    tag: "0.1.0"
    pullPolicy: IfNotPresent

  driver:
    cores: 1
    coreLimit: "1000m"
    memory: "512m"
    labels:
      version: "3.5.1"
      role: driver
    serviceAccount: spark-operator-spark

  executor:
    cores: 1
    coreLimit: "1000m"
    instances: 1
    memory: "640m"
    labels:
      version: "3.5.1"
      role: executor

  # Empty by default so single-node clusters schedule anywhere (multi-node:
  # nodeSelector: {node-role.kubernetes.io/compute: "true"}).
  nodeSelector: {}

  iceberg:
    catalogName: "polaris"
    # MUST include the /api/catalog path segment: Polaris serves the Iceberg
    # REST API at /api/catalog/v1/*, so a bare host made the client request
    # /v1/config and get a 404. s4-stream and s5-serving already carry it.
    catalogUrl: "http://polaris.platform.svc.cluster.local:8181/api/catalog"
    # This is the CATALOG NAME, not the S3 location, and that distinction is
    # the whole bug. An Iceberg REST client identifies its catalog through
    # GET <uri>/v1/config?warehouse=<this value>, and Polaris resolves it by
    # name - so "s3a://warehouse/" produced
    #   RESTException: Unable to find warehouse s3a://warehouse/
    # even though the catalog existed with exactly that base location.
    # The S3 base location stays in s2-lakehouse -> polaris.config.warehouseLocation.
    warehouse: "polaris"
    s3Endpoint: "http://minio.platform.svc.cluster.local:9000"
    s3Region: "us-east-1"
    accessKey: "minioadmin"
    secretKey: "minioadmin"
    # OAuth2 credential for Polaris 1.x. Format "client_id:client_secret";
    # must match polaris.clientId/clientSecret in s2-lakehouse/values.yaml.
    # Without it Polaris answers 401 and no Iceberg table is reachable.
    oauth2Credential: "poc-admin:poc-admin-secret"

  openLineage:
    url: "http://marquez.platform.svc.cluster.local:5000"
    namespace: "poc_data_engineering"

  database:
    jdbcUrl: "jdbc:postgresql://postgres-oltp.platform.svc.cluster.local:5432/poc_oltp"
    jdbcUser: "postgres"
    jdbcPassword: "oltp_password_secret"

jobs:
  bronzeIngestion:
    enabled: true
    schedule: "0 2 * * *"
  silverTransform:
    enabled: true
    schedule: "0 3 * * *"
  goldAggregation:
    enabled: true
    schedule: "0 4 * * *"
