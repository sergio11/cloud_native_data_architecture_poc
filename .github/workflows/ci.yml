name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check src tests pipelines governance quality data-generator lineage

      - name: Format check (ruff format)
        run: ruff format --check src tests pipelines governance quality data-generator lineage

      - name: Type check (mypy)
        run: python -m mypy

      - name: Tests with coverage
        run: python -m pytest tests -q --cov=src --cov-branch --cov-fail-under=85 --cov-config=pyproject.toml
