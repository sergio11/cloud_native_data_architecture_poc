# ==============================================================================
# Lakehouse rows probe Job (rake lakehouse:rows)
#
# One pod that reads the Iceberg catalogue and the medallion tables, and
# reports how many rows each tier really has. It is the acceptance check for
# the batch phase: "bronze, silver and gold have rows in the lakehouse",
# read from the lakehouse itself and not from a log line.
#
# The script travels in a ConfigMap so it can be corrected without paying the
# image rebuild and per-node load cycle.
# ==============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: lakehouse-rows-probe
  namespace: platform
  labels:
    app: lakehouse-rows-probe
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: lakehouse-rows-probe
    spec:
      restartPolicy: Never
      # Pinned on purpose: the probe must run where the image was loaded, so a
      # missing image cannot be mistaken for a failure of the probe.
      # The compute node, which is where the ingestion image is loaded and
      # which stays up while the "worker" node is stopped.
      nodeSelector:
        kubernetes.io/hostname: poc-data-platform-worker2
      volumes:
        - name: script
          configMap:
            name: lakehouse-rows-probe
      containers:
        - name: probe
          image: docker.io/poc/ingest:0.1.0
          imagePullPolicy: Never
          workingDir: /app
          env:
            - name: POC_REPO_ROOT
              value: /app
            # The lakehouse port resolves to the Iceberg implementation.
            - name: LAKEHOUSE_BACKEND
              value: iceberg
            - name: ICEBERG_CATALOG_URI
              value: http://polaris.platform.svc.cluster.local:8181/api/catalog
            - name: ICEBERG_CATALOG_NAME
              value: polaris
            - name: POLARIS_OAUTH2_CREDENTIAL
              value: poc-admin:poc-admin-secret
            # Without this scope the Iceberg client sends its own default,
            # "catalog", and Polaris rejects it with
            #   invalid_scope: The scope is invalid
            - name: POLARIS_OAUTH2_SCOPE
              value: PRINCIPAL_ROLE:ALL
            - name: MINIO_ENDPOINT
              value: http://minio.platform.svc.cluster.local:9000
            - name: MINIO_ACCESS_KEY
              value: minioadmin
            - name: MINIO_SECRET_KEY
              value: minioadmin
            - name: MINIO_REGION
              value: us-east-1
            # Which tiers have to have rows for the probe to pass. The stream
            # tier is a different phase, so it is not required here.
            - name: EXPECTED_TIERS
              value: bronze,silver,gold
          volumeMounts:
            - name: script
              mountPath: /probe
              readOnly: true
          command:
            - /bin/sh
            - -c
            - |
              set -x
              python3 /probe/lakehouse_rows_probe.py
              echo "PROBE_EXIT=$?"
