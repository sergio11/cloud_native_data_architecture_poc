# Serving profile. Each `subsystems.<chart>` is a verbatim Helm values fragment
# for infra/helm/<chart>. Trino reads the batch and speed tables through the
# single `iceberg` catalog; the unified view merges them.

profile:
  name: "serving"
      description: "Trino serving layer over the Iceberg lakehouse (unified batch + stream view)"
  targetRamMb: 1728
  targetCpuCores: 2.5

subsystems:
  s1-ingestion:
    postgresql:
      # Off: serving reads the lakehouse, not the OLTP source.
      enabled: false
    ingestionRunner:
      enabled: false

  s2-lakehouse:
    minio:
      enabled: true
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "400m"
          memory: "448Mi"
    polaris:
      enabled: true
      resources:
        requests:
          cpu: "150m"
          memory: "256Mi"
        limits:
          cpu: "600m"
          memory: "384Mi"

  s5-serving:
    trino:
      enabled: true
      # Heap must leave room for metaspace and direct buffers inside the limit.
      resources:
        requests:
          cpu: "400m"
          memory: "640Mi"
        limits:
          cpu: "1200m"
          memory: "1024Mi"
      jvm:
        maxHeapSize: "640M"
      query:
        maxMemory: "512MB"
        maxMemoryPerNode: "256MB"
