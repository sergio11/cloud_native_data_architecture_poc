# ==============================================================================
# Subsystem S4: Stream Processing Layer - Values Configuration
# File: infra/helm/s4-stream/values.yaml
# ==============================================================================

global:
  namespace: platform
  computeNamespace: sales
  storageClass: "standard"

kafka:
  enabled: true
  replicaCount: 1
  image:
    repository: apache/kafka
    tag: "3.7.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 9092

  persistence:
    enabled: true
    storageClass: "standard"
    size: 5Gi

  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: 800m
      memory: 768Mi

  nodeSelector:
    node-role.kubernetes.io/storage: "true"

kafkaUi:
  enabled: true
  replicaCount: 1
  image:
    repository: provectuslabs/kafka-ui
    tag: "v0.7.2"
    pullPolicy: IfNotPresent

  service:
    type: NodePort
    port: 8090
    nodePort: 8090

  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 192Mi

topics:
  - name: "sales.orders.events"
    partitions: 3
    replicationFactor: 1
  - name: "marketing.clickstream.raw"
    partitions: 3
    replicationFactor: 1

flinkOperator:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/apache/flink-kubernetes-operator
    tag: "1.8.0"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 400m
      memory: 256Mi

  nodeSelector:
    node-role.kubernetes.io/compute: "true"

flinkJobs:
  ordersStream:
    enabled: true
    # Built from repo root: docker build -f infra/docker/flink.Dockerfile -t poc/flink-stream:0.1.0 .
    image: poc/flink-stream:0.1.0
    jobManager:
      memory: "256m"
      cpu: 0.3
    taskManager:
      memory: "384m"
      cpu: 0.4
      replicas: 1
  clickstreamStream:
    enabled: true
    # Built from repo root: docker build -f infra/docker/flink.Dockerfile -t poc/flink-stream:0.1.0 .
    image: poc/flink-stream:0.1.0
    jobManager:
      memory: "256m"
      cpu: 0.3
    taskManager:
      memory: "384m"
      cpu: 0.4
      replicas: 1
