# Event producer Job: feeds the speed layer from inside the cluster, because the
# broker's advertised name does not resolve from the workstation and local Python
# lacks confluent-kafka.
apiVersion: batch/v1
kind: Job
metadata:
  name: event-producer
  namespace: platform
  labels:
    app: event-producer
spec:
  backoffLimit: 2
  # Runs for --duration seconds; the deadline is a backstop for a hung producer.
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: event-producer
    spec:
      restartPolicy: Never
      # Compute node: the image is loaded here and the speed layer runs here.
      nodeSelector:
        kubernetes.io/hostname: poc-data-platform-worker2
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "300m"
          memory: "256Mi"
      containers:
        - name: producer
          image: docker.io/poc/ingest:0.1.0
          imagePullPolicy: Never
          workingDir: /app
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka.platform.svc.cluster.local:9092
          command:
            - python
            - data-generator/event_producer.py
            - --bootstrap-servers
            - kafka.platform.svc.cluster.local:9092
            - --rate
            - "20"
            - --duration
            - "60"