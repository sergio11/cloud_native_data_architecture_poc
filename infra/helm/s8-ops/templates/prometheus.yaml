# Self-contained Prometheus. Rules come from the chart asset
# prometheus/alerts.yaml via .Files.Get, which returns the content untemplated.
{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "s8-ops.fullname" . }}-prometheus
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "s8-ops.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval | quote }}
    rule_files:
      - /etc/prometheus/rules/alerts.yaml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - "localhost:9090"
      # Targets that actually export metrics; rules for absent metrics are commented out.
      - job_name: kafka
        static_configs:
          - targets:
              - "kafka.{{ .Values.global.namespace }}.svc.cluster.local:9092"
      - job_name: minio
        metrics_path: /minio/v2/metrics/cluster
        static_configs:
          - targets:
              - "minio.{{ .Values.global.namespace }}.svc.cluster.local:9000"
  alerts.yaml: |
    {{- .Files.Get "prometheus/alerts.yaml" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "s8-ops.fullname" . }}-prometheus
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "s8-ops.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  replicas: {{ .Values.prometheus.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "s8-ops.name" . }}
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "s8-ops.name" . }}
        app.kubernetes.io/component: prometheus
    spec:
      containers:
        - name: prometheus
          image: "{{ .Values.prometheus.image.repository }}:{{ .Values.prometheus.image.tag }}"
          imagePullPolicy: {{ .Values.prometheus.image.pullPolicy }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retention }}
          ports:
            - containerPort: 9090
              name: web
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: config
              mountPath: /etc/prometheus/rules/alerts.yaml
              subPath: alerts.yaml
            # emptyDir keeps the TSDB for the life of the pod; it does not survive a restart.
            - name: data
              mountPath: /prometheus
          # Without probes a wedged Prometheus stays in the Service endpoints.
          startupProbe:
            httpGet:
              path: /-/ready
              port: 9090
            timeoutSeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            timeoutSeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            timeoutSeconds: 10
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "s8-ops.fullname" . }}-prometheus
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "s8-ops.fullname" . }}-prometheus
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "s8-ops.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  type: {{ .Values.prometheus.service.type }}
  ports:
    - port: {{ .Values.prometheus.service.port }}
      targetPort: 9090
      name: web
  selector:
    app.kubernetes.io/name: {{ include "s8-ops.name" . }}
    app.kubernetes.io/component: prometheus
{{- end }}
