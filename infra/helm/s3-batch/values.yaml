# Batch layer: Spark Operator and the medallion jobs.

global:
  namespace: platform
  computeNamespace: sales

sparkOperator:
  enabled: true
  replicaCount: 1
  image:
    # Latest v1beta2 CRD API compatible with Spark 3.5.
    repository: kubeflow/spark-operator
    tag: "v1beta2-1.6.2-3.5.0"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

  # Empty schedules anywhere (multi-node: node-role.kubernetes.io/compute).
  nodeSelector: {}

  tolerations: []
  affinity: {}

sparkDefaults:
  image:
    # Built from the repo root with infra/docker/spark.Dockerfile.
    repository: poc/spark-medallion
    tag: "0.1.0"
    pullPolicy: IfNotPresent

  # The v1beta2 operator cannot pass arguments to the main file, so the entity travels as MEDALLION_ENTITY.
  entity: "all"

  driver:
    cores: 1
    coreLimit: "1000m"
    memory: "512m"
    # Room outside the JVM heap for the JVM and Python worker. The pod limit is
    # memory + memoryOverhead; Spark's Python default (0.40) leaves too little.
    memoryOverhead: "384m"
    labels:
      version: "3.5.1"
      role: driver
    serviceAccount: spark-operator-spark

  executor:
    cores: 1
    coreLimit: "1000m"
    instances: 1
    memory: "512m"
    memoryOverhead: "384m"
    labels:
      version: "3.5.1"
      role: executor

  # Empty schedules anywhere (multi-node: node-role.kubernetes.io/compute).
  nodeSelector: {}

  iceberg:
    catalogName: "polaris"
    # Must include /api/catalog: Polaris serves the REST API under it.
    catalogUrl: "http://polaris.platform.svc.cluster.local:8181/api/catalog"
    # Catalog name, not the S3 location: REST clients look it up through
    # ?warehouse=<this value>; the base location lives in s2-lakehouse.
    warehouse: "polaris"
    # Polaris rejects the Iceberg client's default scope.
    oauth2Scope: "PRINCIPAL_ROLE:ALL"
    # Lakehouse port implementation: iceberg writes to the real lakehouse, sqlite to a file.
    lakehouseBackend: "iceberg"
    s3Endpoint: "http://minio.platform.svc.cluster.local:9000"
    s3Region: "us-east-1"
    accessKey: "minioadmin"
    secretKey: "minioadmin"
    # client_id:client_secret; must match s2-lakehouse or Polaris answers 401.
    oauth2Credential: "poc-admin:poc-admin-secret"

  openLineage:
    url: "http://marquez.platform.svc.cluster.local:5000"
    namespace: "poc_data_engineering"

  database:
    # host/port/name feed psycopg2; jdbcUrl is for the JVM side.
    host: "postgres-oltp.platform.svc.cluster.local"
    port: "5432"
    name: "poc_oltp"
    jdbcUrl: "jdbc:postgresql://postgres-oltp.platform.svc.cluster.local:5432/poc_oltp"
    jdbcUser: "postgres"
    jdbcPassword: "oltp_password_secret"

jobs:
  bronzeIngestion:
    # Off: bronze is ingested by the s1 CronJob; two writers on one Iceberg table conflict.
    enabled: false
    schedule: "0 2 * * *"
  silverTransform:
    enabled: true
    schedule: "0 3 * * *"
  goldAggregation:
    enabled: true
    schedule: "0 4 * * *"
