apiVersion: apps/v1
kind: Deployment
metadata:
  name: marquez
  namespace: platform
  labels:
    app: marquez
    subsystem: s7-fabric
spec:
  replicas: {{ .Values.marquez.replicaCount }}
  selector:
    matchLabels:
      app: marquez
  template:
    metadata:
      labels:
        app: marquez
    spec:
      containers:
        - name: marquez
          image: "{{ .Values.marquez.image.repository }}:{{ .Values.marquez.image.tag }}"
          imagePullPolicy: {{ .Values.marquez.image.pullPolicy }}
          ports:
            - containerPort: 5000
              name: api
            - containerPort: 3000
              name: web
          env:
            - name: MARQUEZ_PORT
              value: "5000"
            - name: MARQUEZ_ADMIN_PORT
              value: "5001"
          resources:
            {{- toYaml .Values.marquez.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: marquez
  namespace: platform
  labels:
    app: marquez
spec:
  type: {{ .Values.marquez.service.type }}
  ports:
    - port: 5000
      targetPort: 5000
      name: api
    - port: 3000
      targetPort: 3000
      nodePort: {{ .Values.marquez.service.nodePortApi }}
      name: web
  selector:
    app: marquez
