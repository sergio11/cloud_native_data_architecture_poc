{{- if .Values.flinkOperator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-kubernetes-operator
  namespace: {{ .Values.global.namespace | default "platform" }}
  labels:
    app: flink-kubernetes-operator
    {{- include "s4-stream.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.flinkOperator.replicaCount }}
  selector:
    matchLabels:
      app: flink-kubernetes-operator
  template:
    metadata:
      labels:
        app: flink-kubernetes-operator
        {{- include "s4-stream.labels" . | nindent 8 }}
    spec:
      serviceAccountName: flink-operator-sa
      {{- with .Values.flinkOperator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: flink-operator
          image: "{{ .Values.flinkOperator.image.repository }}:{{ .Values.flinkOperator.image.tag }}"
          imagePullPolicy: {{ .Values.flinkOperator.image.pullPolicy }}
          # The upstream image entrypoint requires the role as first argument
          # (operator|webhook); without it the container exits immediately.
          args:
            - operator
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPERATOR_NAME
              value: flink-kubernetes-operator
            - name: FLINK_CONF_flink_k8s_operator_dynamic_namespaces_enabled
              value: "true"
          resources:
            {{- toYaml .Values.flinkOperator.resources | nindent 12 }}
          # The operator is a JVM that needs well over a minute to bind 8085 on
          # a 4-CPU node. Without a startupProbe the livenessProbe fires while it
          # is still booting and kubelet SIGTERMs it (exit 143) before it ever
          # becomes healthy, so it restarts forever. The startupProbe suspends
          # both probes until the JVM answers, which is the only place a Java
          # cold start can be given real time.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8085
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8085
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8085
            periodSeconds: 20
            failureThreshold: 6
{{- end }}
