# Stream profile. Each `subsystems.<chart>` is a verbatim Helm values fragment
# for infra/helm/<chart>. Limits are sized for the kind VM; check the total
# before raising them.

profile:
  name: "stream"
  description: "Real-time stream processing with Kafka, Apache Flink, and Observability"
  targetRamMb: 2624
  targetCpuCores: 4.0

subsystems:
  s1-ingestion:
    postgresql:
      enabled: true
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "384Mi"
    ingestionRunner:
      enabled: false

  s2-lakehouse:
    minio:
      enabled: true
      resources:
        requests:
          cpu: "150m"
          memory: "256Mi"
        limits:
          cpu: "400m"
          # Committing small parquet files per checkpoint needs the headroom.
          memory: "448Mi"
    polaris:
      enabled: true
      resources:
        requests:
          cpu: "150m"
          memory: "256Mi"
        limits:
          cpu: "600m"
          memory: "384Mi"

  s4-stream:
    kafka:
      enabled: true
      # Broker RSS is heap plus direct buffers; keep the heap below the limit.
      heapOpts: "-Xms192m -Xmx256m -XX:MaxDirectMemorySize=64m"
      resources:
        requests:
          cpu: "300m"
          memory: "320Mi"
        limits:
          cpu: "800m"
          memory: "448Mi"
    kafkaUi:
      # Off to save memory: the UI is not part of the data path.
      enabled: false
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "200m"
          memory: "256Mi"
    flinkOperator:
      enabled: true
      replicaCount: 1
      # Quarkus JVM: needs at least 384Mi to boot.
      resources:
        requests:
          cpu: "150m"
          memory: "256Mi"
        limits:
          cpu: "400m"
          memory: "384Mi"
    flinkJobs:
      ordersStream:
        enabled: true
        # The Flink image is only loaded on the compute node, so pin the job here.
        nodeSelector:
          kubernetes.io/hostname: poc-data-platform-worker2
        jobManager:
          # The operator rejects a JobManager below 768m.
          memory: "768m"
          cpu: 0.5
        taskManager:
          # Fixed framework, network and managed-memory costs do not shrink with the limit.
          memory: "1024m"
          cpu: 0.5
          replicas: 1
      clickstreamStream:
        # Off: two Flink jobs (JM + TM each) do not fit on this VM.
        enabled: false
        jobManager:
          memory: "768m"
          cpu: 0.5
        taskManager:
          memory: "1024m"
          cpu: 0.5
          replicas: 1

  # No s5-serving section: Flink and Trino do not fit on this VM at the same time.
