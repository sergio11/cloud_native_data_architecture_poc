# ==============================================================================
# Subsystem S6: Data Mesh Governance - Values Configuration
# File: infra/helm/s6-mesh/values.yaml
# ==============================================================================

global:
  namespace: platform

# PREREQUISITE (K-B): installing Kyverno itself is NOT done by this chart.
# Install it first from its official chart/OCI (offline env: no dependency
# build is attempted, the Chart.yaml dependency stays commented). The flag
# below only gates the ClusterPolicies rendered by
# templates/kyverno-policies.yaml from governance/policies/*.yaml.
# DEFERRED (RF-17): no template in templates/ consumes this block yet — admission
# control is not rendered; scripts/setup-cluster.sh only registers the Kyverno repo.
kyverno:
  enabled: true
  # Gate for templates/kyverno-policies.yaml (ClusterPolicies only).
  policiesEnabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/kyverno/kyverno
    tag: "v1.11.4"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 192Mi

  # Empty by default so single-node clusters schedule anywhere (multi-node:
  # nodeSelector: {node-role.kubernetes.io/compute: "true"}).
  nodeSelector: {}

crds:
  install: true

# SINGLE SOURCE OF TRUTH for per-domain ResourceQuota/LimitRange (rendered by
# templates/domain-quotas.yaml). The former duplicate governance/policies/domain-quotas.yaml
# was deleted: scripts/setup.sh applies governance/policies/ wholesale, so keeping both
# would install contradictory quotas (e.g. sales 15 pods/4Gi vs 20 pods/6Gi here — this chart wins).
domains:
  sales:
    enabled: true
    namespace: sales
    quotas:
      requestsCpu: "2000m"
      requestsMemory: "4Gi"
      limitsCpu: "4000m"
      limitsMemory: "6Gi"
      pods: "20"
      persistentvolumeclaims: "10"
  marketing:
    enabled: true
    namespace: marketing
    quotas:
      requestsCpu: "1500m"
      requestsMemory: "3Gi"
      limitsCpu: "3000m"
      limitsMemory: "5Gi"
      pods: "15"
      persistentvolumeclaims: "8"
  finance:
    enabled: true
    namespace: finance
    quotas:
      requestsCpu: "1000m"
      requestsMemory: "2Gi"
      limitsCpu: "2000m"
      limitsMemory: "4Gi"
      pods: "10"
      persistentvolumeclaims: "5"

policies:
  enforceContracts: true
  requireOwnerEmail: true
  validateQualityThresholds: true
