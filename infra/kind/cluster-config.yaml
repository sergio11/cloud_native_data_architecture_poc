# kind cluster: one control plane and two workers, host port mappings for the
# web UIs and APIs, and a hostPath bind mount per node under ./data.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: poc-data-platform
networking:
  ipFamily: ipv4
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443
nodes:
  # Do not set `labels:` on kind nodes: they become kubelet --node-labels and the
  # kubelet refuses kubernetes.io/ or k8s.io/ namespaced labels, so the node never
  # joins. `rake cluster:create` applies the domain roles once nodes are Ready.
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            service-node-port-range: "1-65535"
    extraPortMappings:
      # Grafana
      - containerPort: 3000
        hostPort: 3000
        protocol: TCP
        listenAddress: "0.0.0.0"
      # Dagster
      - containerPort: 3001
        hostPort: 3001
        protocol: TCP
        listenAddress: "0.0.0.0"
      # Marquez
      - containerPort: 3002
        hostPort: 3002
        protocol: TCP
        listenAddress: "0.0.0.0"
      # Metabase
      - containerPort: 3003
        hostPort: 3003
        protocol: TCP
        listenAddress: "0.0.0.0"
      # Trino
      - containerPort: 8080
        hostPort: 8080
        protocol: TCP
        listenAddress: "0.0.0.0"
      # Kafka UI
      - containerPort: 8090
        hostPort: 8090
        protocol: TCP
        listenAddress: "0.0.0.0"
      # MinIO S3 API
      - containerPort: 9000
        hostPort: 9000
        protocol: TCP
        listenAddress: "0.0.0.0"
      # MinIO console
      - containerPort: 9001
        hostPort: 9001
        protocol: TCP
        listenAddress: "0.0.0.0"
      # Polaris REST catalog
      - containerPort: 8181
        hostPort: 8181
        protocol: TCP
        listenAddress: "0.0.0.0"
    extraMounts:
      - hostPath: ./data/control-plane
        containerPath: /data
        readOnly: false

  # Storage node: MinIO, PostgreSQL, Kafka and Polaris.
  - role: worker
    extraMounts:
      - hostPath: ./data/worker-storage
        containerPath: /data
        readOnly: false

  # Compute node: Spark, Flink and Trino.
  - role: worker
    extraMounts:
      - hostPath: ./data/worker-compute
        containerPath: /data
        readOnly: false