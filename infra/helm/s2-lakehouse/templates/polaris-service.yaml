{{- if .Values.polaris.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: polaris
  namespace: {{ .Values.global.namespace | default "platform" }}
  labels:
    app: polaris
    {{- include "s2-lakehouse.labels" . | nindent 4 }}
spec:
  type: {{ .Values.polaris.service.type }}
  ports:
    - name: rest-api
      port: {{ .Values.polaris.service.port }}
      targetPort: 8181
      {{- if eq .Values.polaris.service.type "NodePort" }}
      # nodePort is rejected by the API server on a ClusterIP Service
      # ("may not be used when 'type' is 'ClusterIP'"), so it is emitted only
      # when the type is actually NodePort.
      nodePort: {{ .Values.polaris.service.nodePort }}
      {{- end }}
      protocol: TCP
    - name: management
      port: 8182
      targetPort: 8182
      protocol: TCP
  selector:
    app: polaris
{{- end }}
