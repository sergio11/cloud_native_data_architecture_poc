{{- if .Values.kafka.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-creator
  namespace: {{ .Values.global.namespace | default "platform" }}
  labels:
    app: kafka-topic-creator
    {{- include "s4-stream.labels" . | nindent 4 }}
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: kafka-topic-creator
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Kafka broker on port 9092..."
              until nc -z -w 2 kafka.{{ .Values.global.namespace | default "platform" }}.svc.cluster.local 9092; do
                sleep 2
              done
              echo "Kafka is reachable."
      containers:
        - name: topic-init
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          imagePullPolicy: {{ .Values.kafka.image.pullPolicy }}
          command:
            - /bin/sh
            - -ce
            - |
              echo "Initializing Kafka Topics..."
              {{- range .Values.topics }}
              /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server kafka.{{ $.Values.global.namespace | default "platform" }}.svc.cluster.local:9092 \
                --create --if-not-exists \
                --topic {{ .name }} \
                --partitions {{ .partitions }} \
                --replication-factor {{ .replicationFactor }}
              {{- end }}
              echo "Listing created topics:"
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka.{{ .Values.global.namespace | default "platform" }}.svc.cluster.local:9092 --list
              echo "Topics successfully provisioned."
{{- end }}
