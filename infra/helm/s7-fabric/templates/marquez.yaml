{{- if .Values.marquez.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marquez
  namespace: platform
  labels:
    app: marquez
    subsystem: s7-fabric
spec:
  replicas: {{ .Values.marquez.replicaCount }}
  selector:
    matchLabels:
      app: marquez
  template:
    metadata:
      labels:
        app: marquez
    spec:
      containers:
        - name: marquez
          image: "{{ .Values.marquez.image.repository }}:{{ .Values.marquez.image.tag }}"
          imagePullPolicy: {{ .Values.marquez.image.pullPolicy }}
          ports:
            - containerPort: 5000
              name: api
            - containerPort: 3000
              name: web
          env:
            - name: MARQUEZ_PORT
              value: "5000"
            - name: MARQUEZ_ADMIN_PORT
              value: "5001"
            # Catalog host; without it the server dies in the Flyway migration.
            - name: POSTGRES_HOST
              value: "marquez-postgresql"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "marquez"
            - name: POSTGRES_USER
              value: "marquez"
            - name: POSTGRES_PASSWORD
              value: "marquez"
            # The first migration of a fresh database otherwise fails.
            - name: FLYWAY_BASELINE_ON_MIGRATE
              value: "true"
            # The default 1/4-of-RAM heap does not fit this container's limit.
            - name: JAVA_OPTS
              value: "-Xms128m -Xmx320m -XX:+UseG1GC"
          resources:
            {{- toYaml .Values.marquez.resources | nindent 12 }}
          # Probes gate the Service endpoints and give the JVM 5 minutes to boot.
          startupProbe:
            httpGet:
              path: /api/marquez/version
              port: 5000
            timeoutSeconds: 10
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/marquez/version
              port: 5000
            timeoutSeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/marquez/version
              port: 5000
            timeoutSeconds: 10
            periodSeconds: 20
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: marquez
  namespace: platform
  labels:
    app: marquez
spec:
  type: {{ .Values.marquez.service.type }}
  ports:
    - port: 5000
      targetPort: 5000
      name: api
    - port: {{ .Values.marquez.service.webPort }}
      targetPort: {{ .Values.marquez.service.webPort }}
      nodePort: {{ .Values.marquez.service.nodePortWeb }}
      name: web
  selector:
    app: marquez
{{- end }}
