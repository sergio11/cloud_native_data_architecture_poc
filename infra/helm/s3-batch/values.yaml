# ==============================================================================
# Subsystem S3: Batch Processing Layer - Values Configuration
# File: infra/helm/s3-batch/values.yaml
# ==============================================================================

global:
  namespace: platform
  computeNamespace: sales

sparkOperator:
  enabled: true
  replicaCount: 1
  image:
    # v1beta2-1.6.2-3.5.0 = latest v1beta2 CRD API compatible with Spark 3.5.x.
    repository: kubeflow/spark-operator
    tag: "v1beta2-1.6.2-3.5.0"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

  # Empty by default so single-node clusters schedule anywhere (multi-node:
  # nodeSelector: {node-role.kubernetes.io/compute: "true"}).
  nodeSelector: {}

  tolerations: []
  affinity: {}

sparkDefaults:
  image:
    # Built from repo root: docker build -f infra/docker/spark.Dockerfile -t poc/spark-medallion:0.1.0 .
    repository: poc/spark-medallion
    tag: "0.1.0"
    pullPolicy: IfNotPresent

  # What the medallion tiers process. The Spark Operator (v1beta2) cannot
  # pass arguments to the main file (`args` is not in the CRD schema), so the
  # entity travels in the environment: the scripts read MEDALLION_ENTITY, and
  # "all" means every entity of the tier.
  entity: "all"

  driver:
    cores: 1
    coreLimit: "1000m"
    memory: "512m"
    # Off-heap memory of the driver container: the JVM outside its heap plus
    # the Python worker that runs next to it. The pod limit is
    # memory + memoryOverhead, so this is the room the driver actually has
    # besides the heap. Set it explicitly: Spark's default factor for a
    # Kubernetes non-JVM (Python) job is 0.40, and with the heap alone
    # filling the container the first allocation gets the pod OOM-killed.
    memoryOverhead: "384m"
    labels:
      version: "3.5.1"
      role: driver
    serviceAccount: spark-operator-spark

  executor:
    cores: 1
    coreLimit: "1000m"
    instances: 1
    memory: "512m"
    memoryOverhead: "384m"
    labels:
      version: "3.5.1"
      role: executor

  # Empty by default so single-node clusters schedule anywhere (multi-node:
  # nodeSelector: {node-role.kubernetes.io/compute: "true"}).
  nodeSelector: {}

  iceberg:
    catalogName: "polaris"
    # MUST include the /api/catalog path segment: Polaris serves the Iceberg
    # REST API at /api/catalog/v1/*, so a bare host made the client request
    # /v1/config and get a 404. s4-stream and s5-serving already carry it.
    catalogUrl: "http://polaris.platform.svc.cluster.local:8181/api/catalog"
    # This is the CATALOG NAME, not the S3 location, and that distinction is
    # the whole bug. An Iceberg REST client identifies its catalog through
    # GET <uri>/v1/config?warehouse=<this value>, and Polaris resolves it by
    # name - so "s3a://warehouse/" produced
    #   RESTException: Unable to find warehouse s3a://warehouse/
    # even though the catalog existed with exactly that base location.
    # The S3 base location stays in s2-lakehouse -> polaris.config.warehouseLocation.
    warehouse: "polaris"
    # The scope Polaris demands on the token request. The Iceberg client's own
    # default is "catalog" and Polaris rejects it with
    #   invalid_scope: The scope is invalid
    oauth2Scope: "PRINCIPAL_ROLE:ALL"
    # Which implementation of the lakehouse port the medallion persists
    # through: "iceberg" writes the tier tables to the real lakehouse (Polaris
    # catalog, MinIO data files), "sqlite" keeps them in a local file.
    lakehouseBackend: "iceberg"
    s3Endpoint: "http://minio.platform.svc.cluster.local:9000"
    s3Region: "us-east-1"
    accessKey: "minioadmin"
    secretKey: "minioadmin"
    # OAuth2 credential for Polaris 1.x. Format "client_id:client_secret";
    # must match polaris.clientId/clientSecret in s2-lakehouse/values.yaml.
    # Without it Polaris answers 401 and no Iceberg table is reachable.
    oauth2Credential: "poc-admin:poc-admin-secret"

  openLineage:
    url: "http://marquez.platform.svc.cluster.local:5000"
    namespace: "poc_data_engineering"

  database:
    # host/port/name are what the code reads (oltp_source.py builds the
    # connection with psycopg2 from PGHOST/PGPORT/PGDATABASE). jdbcUrl is kept
    # for the JVM side, which cannot use libpq.
    host: "postgres-oltp.platform.svc.cluster.local"
    port: "5432"
    name: "poc_oltp"
    jdbcUrl: "jdbc:postgresql://postgres-oltp.platform.svc.cluster.local:5432/poc_oltp"
    jdbcUser: "postgres"
    jdbcPassword: "oltp_password_secret"

jobs:
  bronzeIngestion:
    # OFF by default. Bronze is ingested by the s1 CronJob
    # (medallion-bronze-ingestion-cron, image poc/ingest:0.1.0) and NOT by
    # Spark: with both enabled the same Iceberg table had two writers, one
    # every 15 minutes and one at 02:00, which is a commit conflict waiting to
    # happen. One path per profile. Flip this to true to move bronze back to
    # Spark (and ingestionRunner.enabled to false in s1).
    enabled: false
    schedule: "0 2 * * *"
  silverTransform:
    enabled: true
    schedule: "0 3 * * *"
  goldAggregation:
    enabled: true
    schedule: "0 4 * * *"
