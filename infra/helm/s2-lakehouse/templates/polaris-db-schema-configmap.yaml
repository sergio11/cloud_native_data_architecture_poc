{{- if and .Values.polaris.enabled (ne .Values.polaris.persistence.type "in-memory") }}
# Relational schema for the Polaris metastore (the image cannot create it). It is
# the official idempotent schema; on a Polaris upgrade replace it with the new one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: polaris-db-schema
  namespace: {{ .Values.global.namespace | default "platform" }}
  labels:
    app: polaris-db-schema
    {{- include "s2-lakehouse.labels" . | nindent 4 }}
  annotations:
    # A hook: the Job that mounts it runs as a pre-install hook; weight 4 is ahead of it.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "4"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  postgres-schema.sql: |
{{ .Files.Get "files/postgres-schema-v6.sql" | indent 4 }}
{{- end }}