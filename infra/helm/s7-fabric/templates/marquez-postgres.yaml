{{- if .Values.marquezPostgres.enabled }}
# The PostgreSQL database Marquez keeps its catalogue in (the upstream subchart stand-in).
apiVersion: v1
kind: Service
metadata:
  name: marquez-postgresql
  namespace: platform
  labels:
    app: marquez-postgresql
    subsystem: s7-fabric
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: marquez-postgresql
---
# The Marquez image names the database host "postgres" literally, so this Service aliases it.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: platform
  labels:
    app: marquez-postgresql
    subsystem: s7-fabric
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: marquez-postgresql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marquez-postgresql
  namespace: platform
  labels:
    app: marquez-postgresql
    subsystem: s7-fabric
spec:
  replicas: 1
  strategy:
    # Recreate: two pods would fight over the same volume.
    type: Recreate
  selector:
    matchLabels:
      app: marquez-postgresql
  template:
    metadata:
      labels:
        app: marquez-postgresql
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.marquezPostgres.image.repository }}:{{ .Values.marquezPostgres.image.tag }}"
          imagePullPolicy: {{ .Values.marquezPostgres.image.pullPolicy }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "marquez"
            - name: POSTGRES_USER
              value: "marquez"
            - name: POSTGRES_PASSWORD
              value: "marquez"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            {{- toYaml .Values.marquezPostgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "marquez", "-d", "marquez"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.marquezPostgres.pvc.name }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.marquezPostgres.pvc.name }}
  namespace: platform
  labels:
    app: marquez-postgresql
    subsystem: s7-fabric
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.marquezPostgres.pvc.size }}
  {{- if .Values.marquezPostgres.pvc.storageClass }}
  storageClassName: {{ .Values.marquezPostgres.pvc.storageClass }}
  {{- end }}
{{- end }}
