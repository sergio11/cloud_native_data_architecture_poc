# Modern Data Architecture POC - project metadata and tooling configuration.
#
# Config-only: the code uses a repo-root-on-sys.path layout, so there is no
# [build-system] and no declared packages. Install only the runtime deps below.

[project]
name = "poc-data-engineering"
version = "0.1.0"
description = "Modern Data Architecture POC: Data Mesh, Data Fabric, Medallion Lakehouse, Lambda/Kappa, Serving Layer (100% open source, local-first)"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
# Governance JSON-schema validation (used opportunistically; structural checks run without it)
contracts = ["jsonschema>=4.0"]
# Infrastructure-backed adapters (PostgreSQL source, Trino serving, Kafka broker)
integrations = ["psycopg2-binary>=2.9", "trino>=0.330", "confluent-kafka>=2.3"]
# Orchestration assets
orchestration = ["dagster>=1.6"]
# Dev toolchain: tests + lint + types
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501 is covered by line-length; per-file ignores only where justified below.
ignore = []

[tool.ruff.lint.per-file-ignores]
# UP017 rewrites `timezone.utc`; the Flink job image runs Python 3.10
# (PyFlink 1.18/pemja ships no cp311 wheel), so the streaming jobs stay 3.10.
"pipelines/stream/*" = ["UP017"]

[tool.ruff.format]
# Formatter with ruff's defaults (no overrides). `rake format` rewrites in
# place over the same directories as `rake lint`.


[tool.mypy]
python_version = "3.11"
files = ["src", "pipelines", "governance", "quality", "lineage"]
explicit_package_bases = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_return_any = true
strict_equality = true
exclude = "__pycache__"

# Scoped `ignore_missing_imports`: the repo-root layout means a typo'd internal
# import must still fail loudly, so the flag is never global. Modules that ship
# types (requests, click, rich, dagster) are not listed.
[[tool.mypy.overrides]]
# Integrations extra — not installed in the dev environment (no stubs).
module = ["trino", "confluent_kafka", "psycopg2", "psycopg2.extras"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Installed but untyped upstream.
module = ["yaml", "jsonschema"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Only needed inside the cluster images; the local profile and unit tests use
# the SQLite adapter.
module = ["pyiceberg.*", "pyarrow.*"]
ignore_missing_imports = true
[[tool.mypy.overrides]]
# PyFlink ships no types and exists only inside the Flink job image. Scoped
# rather than global so a typo'd internal import still fails.
module = ["pyflink.*"]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Warnings are errors: resource leaks and deprecations fail the suite.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src", "lineage"]
branch = true

[tool.coverage.report]
# Coverage floor for src+lineage; regressions below it fail the gate.
fail_under = 85
show_missing = true
