{{- /*
RETIRED (2026-10-21) - this template renders NOTHING on purpose.

It used to create a ConfigMap called `spark-platform-defaults` with a
`spark-defaults.conf` key, and it was never mounted in any pod: the three
ScheduledSparkApplications had no `sparkConfigMap:` and no `volumes:`, so
the file was dead configuration. Mounting it as it was written would have
BROKEN the medallion, because it asked for two JARs that are not in the
image:

  spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
  spark.extraListeners=io.openlineage.spark.agent.OpenLineageSparkListener

`apache/spark:3.5.1` (and the pyspark wheel) ship neither the Iceberg Spark
runtime nor the OpenLineage Spark agent, and poc/spark-medallion does not
install them. Spark loads the session extension when the session is created,
so the driver would die with ClassNotFoundException before running a line of
the pipeline.

And both entries were unnecessary anyway:
  * the catalog is opened by PyIceberg (the medallion storage adapter reads
    ICEBERG_CATALOG_URL / ICEBERG_CATALOG_NAME), so Spark never opens a
    catalog of its own;
  * the medallion drivers do not create a SparkSession (the core is
    Spark-free), so an OpenLineage Spark listener would report an empty
    Spark job. The lineage that the platform exposes is published by the
    core itself through MarquezLineageAdapter
    (src/adapters/lineage/marquez_lineage.py), which knows the real inputs
    and outputs of every tier.

If a future pipeline really needs Spark-native lineage or the Iceberg Spark
catalog, the JARs have to be added to the image first (and the file mounted
through `sparkConfigMap:`), not the other way round.
*/ -}}
