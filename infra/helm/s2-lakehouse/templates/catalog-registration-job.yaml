{{- if and .Values.polaris.enabled .Values.catalogRegistration.enabled }}
{{/*
Registers the Iceberg table entries in the Polaris catalog and patches the
product.yaml manifests with physical table paths (and Marquez datasets when
MARQUEZ_URL is set). Runs from the image so code and manifests share a revision.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: polaris-catalog-registration
  namespace: {{ .Values.global.namespace | default "platform" }}
  labels:
    app: polaris-catalog-registration
    {{- include "s2-lakehouse.labels" . | nindent 4 }}
  annotations:
    # A hook, because the pod template is immutable: it is recreated on upgrade.
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "25"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    # The catalogue can be slow to answer on a loaded box.
    helm.sh/hook-timeout: 20m

spec:
  backoffLimit: 5
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: polaris-catalog-registration
    spec:
      restartPolicy: OnFailure
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
      containers:
        - name: registration
          image: "{{ .Values.catalogRegistration.image.repository }}:{{ .Values.catalogRegistration.image.tag }}"
          imagePullPolicy: {{ .Values.catalogRegistration.image.pullPolicy }}
          env:
            # The server root, not /api/catalog: the client appends the API paths itself.
            - name: POLARIS_URL
              value: "http://polaris.{{ .Values.global.namespace | default "platform" }}.svc.cluster.local:{{ .Values.polaris.service.port }}"
            - name: POLARIS_CLIENT_ID
              value: {{ .Values.polaris.clientId | quote }}
            - name: POLARIS_CLIENT_SECRET
              value: {{ .Values.polaris.clientSecret | quote }}
            # Catalog inside Polaris, part of the Iceberg REST path.
            - name: POLARIS_CATALOG_NAME
              value: {{ .Values.polaris.config.defaultCatalog | quote }}
            # Must match the catalog's allowedLocations, or Polaris refuses every table.
            - name: POLARIS_WAREHOUSE_ROOT
              value: {{ .Values.polaris.config.warehouseLocation | quote }}
            # Optional: also registers datasets/jobs in Marquez; unset in the stream profile.
            - name: MARQUEZ_URL
              value: {{ .Values.catalogRegistration.marquezUrl | quote }}
            # The manifests to patch, carried by the image.
            - name: MANIFESTS_DIR
              value: {{ .Values.catalogRegistration.manifestsDir | quote }}
          workingDir: /app
          command:
            - /bin/sh
            - -ce
            - |
              echo "=== Iceberg catalog registration ==="
              python3 pipelines/serving/catalog_registration.py
{{- end }}